<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GSI Raster Heading Replay Test</title>

<link href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:-webkit-fill-available}
body{
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:#111827;
  color:#e6edf3;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
header{
  flex-shrink:0;
  background:#16213e;
  border-bottom:1px solid #0f3460;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.logo{
  width:100%;
  font-size:13px;
  font-weight:800;
  color:#0078ff;
  letter-spacing:.03em;
}
#fileInput{
  flex:1;
  min-width:180px;
  max-width:320px;
  padding:8px;
  border:1px solid #1a5276;
  border-radius:8px;
  background:#0f3460;
  color:#e6edf3;
  font-size:13px;
}
button{
  border:1px solid #1a5276;
  border-radius:8px;
  background:#0f3460;
  color:#e6edf3;
  font-weight:700;
  padding:8px 12px;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
button:active{opacity:.75}
.stats{
  width:100%;
  display:flex;
  gap:14px;
  align-items:flex-end;
  overflow:hidden;
}
.stat{min-width:72px}
.stat.name{flex:1;min-width:0}
.stat-label{
  font-size:9px;
  color:#7d8590;
  letter-spacing:.08em;
}
.stat-value{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.stat-value.hi{color:#0078ff}
#map{
  flex:1;
  min-height:0;
}
.toast{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,107,107,.95);
  color:white;
  padding:10px 16px;
  border-radius:10px;
  z-index:9999;
  display:none;
  max-width:90vw;
  text-align:center;
  font-size:13px;
}
.note{
  position:absolute;
  left:10px;
  bottom:28px;
  z-index:2;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(180,190,200,.9);
  color:#222;
  padding:6px 8px;
  border-radius:8px;
  font-size:10px;
  pointer-events:none;
  max-width:calc(100vw - 20px);
}
.maplibregl-ctrl-attrib{font-size:10px}

.controls{flex-shrink:0;background:#111827;border-top:1px solid #0f3460;padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.play-btn{width:42px;height:36px;border-radius:999px;background:#0f3460;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0}
.play-btn.playing{background:#0078ff;border-color:#0078ff;color:#fff}
#posSlider{flex:1 1 200px;min-width:160px;accent-color:#0078ff}
.pos-info{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-variant-numeric:tabular-nums}
.meter-card{position:relative;min-height:54px;background:linear-gradient(180deg,rgba(15,52,96,.62),rgba(15,52,96,.24));border:1px solid rgba(26,82,118,.72);border-radius:10px;padding:6px 7px 7px;overflow:hidden}
.meter-card label{display:block;font-size:9px;color:#7d8590;letter-spacing:.08em;margin-bottom:3px}
.meter-card span{position:relative;z-index:2;display:block;color:#e6edf3;font-weight:900;font-size:14px;line-height:1.15;white-space:nowrap}
.meter-bar{position:absolute;left:7px;right:7px;bottom:6px;height:5px;border-radius:999px;background:rgba(125,133,144,.24);overflow:hidden}
.meter-fill{height:100%;width:0%;border-radius:999px;background:#0078ff;transition:width .15s linear,background .15s linear}
.selects{display:flex;gap:6px;width:100%;align-items:center}
.selects select{border:1px solid #1a5276;border-radius:8px;background:#0f3460;color:#e6edf3;font-weight:700;padding:8px 10px}
.legend{margin-left:auto;font-size:10px;color:#7d8590;white-space:nowrap}

</style>
</head>

<body>
<header>
  <div class="logo">GSI Raster Heading Replay Test</div>
  <input type="file" id="fileInput" accept=".gpx,.tcx,*/*">
  <button id="fitBtn" type="button">全体</button>
  <button id="northBtn" type="button">北上</button>
  <button id="clearBtn" type="button">クリア</button>

  <div class="stats">
    <div class="stat name">
      <div class="stat-label">ファイル名</div>
      <div class="stat-value" id="sName">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">距離</div>
      <div class="stat-value hi" id="sDist">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">獲得標高</div>
      <div class="stat-value" id="sEle">—</div>
    </div>
  </div>
</header>

<div id="map"></div>
<div class="note">MapLibre + 地理院ラスター標準タイル実験版：白い地図のまま回転できるか確認用です</div>

<div class="controls" id="controls">
  <button class="play-btn" id="playBtn" type="button">▶</button>
  <div class="pos-info">
    <div class="meter-card"><label>DIST</label><span id="posDist">0.0km</span><div class="meter-bar"><div class="meter-fill" id="distFill"></div></div></div>
    <div class="meter-card"><label>ELEV</label><span id="posEle">0m</span><div class="meter-bar"><div class="meter-fill" id="eleFill"></div></div></div>
    <div class="meter-card"><label>PACE</label><span id="posPace">—</span><div class="meter-bar"><div class="meter-fill" id="paceFill"></div></div></div>
    <div class="meter-card"><label>HR</label><span id="posHr">—</span><div class="meter-bar"><div class="meter-fill" id="hrFill"></div></div></div>
  </div>
  <input type="range" id="posSlider" min="0" max="1000" value="0">
  <div class="selects">
    <select id="speedSelect">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
    </select>
    <div class="legend">再生中：進行方向が上 / 1x=30秒</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const fileInput=document.getElementById('fileInput');
const fitBtn=document.getElementById('fitBtn');
const northBtn=document.getElementById('northBtn');
const clearBtn=document.getElementById('clearBtn');
const sName=document.getElementById('sName');
const sDist=document.getElementById('sDist');
const sEle=document.getElementById('sEle');
const playBtn=document.getElementById('playBtn');
const posSlider=document.getElementById('posSlider');
const speedSelect=document.getElementById('speedSelect');
const posDist=document.getElementById('posDist');
const posEle=document.getElementById('posEle');
const posPace=document.getElementById('posPace');
const posHr=document.getElementById('posHr');
const distFill=document.getElementById('distFill');
const eleFill=document.getElementById('eleFill');
const paceFill=document.getElementById('paceFill');
const hrFill=document.getElementById('hrFill');

let currentTrack=null;
let currentBounds=null;
let currentDistance=0,isPlaying=false,playTimer=null,playEnded=false,lastBearing=0;

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',4200);
}

const rasterStyle={
  version:8,
  glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
  sources:{
    gsi_std:{
      type:'raster',
      tiles:['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
      tileSize:256,
      attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
      maxzoom:18
    }
  },
  layers:[
    {
      id:'gsi-std',
      type:'raster',
      source:'gsi_std',
      minzoom:0,
      maxzoom:18
    }
  ]
};

const map=new maplibregl.Map({
  container:'map',
  style:rasterStyle,
  center:[139.767144,35.680621],
  zoom:10,
  minZoom:4,
  maxZoom:18,
  bearing:0,
  pitch:0,
  attributionControl:true
});

map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-left');
map.addControl(new maplibregl.ScaleControl({maxWidth:100,unit:'metric'}),'bottom-left');

map.on('error',e=>console.warn(e));

function haversine(a,b){
  const R=6371000,r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function fmtDist(m){return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}

function normalizeDistances(pts){
  if(!pts||!pts.length)return [];
  const hasDistance=pts.some(p=>Number.isFinite(p.distance)&&p.distance>0);
  if(hasDistance){
    let last=0;
    return pts.map((p,i)=>{
      let d=Number.isFinite(p.distance)?p.distance:last;
      if(i>0&&d<last)d=last;
      last=d;
      return {...p,dist:d};
    });
  }
  let dist=0;
  return pts.map((p,i)=>{
    if(i>0)dist+=haversine(pts[i-1],p);
    return {...p,dist};
  });
}
function calcStats(pts){
  let dist=pts.length?pts[pts.length-1].dist:0,gain=0;
  for(let i=1;i<pts.length;i++){
    const d=pts[i].ele-pts[i-1].ele;
    if(d>0)gain+=d;
  }
  return{dist,gain};
}
function parseGPX(text){
  const clean=text.replace(/^\uFEFF/,'');
  const xml=clean
    .replace(/\s+xmlns[^=]*="[^"]*"/g,'')
    .replace(/<([a-zA-Z]+:[a-zA-Z])/g,m=>'<'+m.slice(m.indexOf(':')+1))
    .replace(/<\/([a-zA-Z]+:[a-zA-Z])/g,m=>'</'+m.slice(m.indexOf(':')+1));

  let name='GPX Track',points=[];
  try{
    const doc=new DOMParser().parseFromString(xml,'application/xml');
    if(!doc.querySelector('parsererror')){
      name=doc.querySelector('trk > name, rte > name, name')?.textContent?.trim()||name;
      doc.querySelectorAll('trkpt, rtept').forEach(p=>{
        const lat=parseFloat(p.getAttribute('lat'));
        const lon=parseFloat(p.getAttribute('lon'));
        if(!isNaN(lat)&&!isNaN(lon)){
          const ele=parseFloat(p.querySelector('ele')?.textContent);
          points.push({lat,lon,ele:Number.isFinite(ele)?ele:0,distance:null});
        }
      });
    }
  }catch(_){}

  if(points.length===0){
    for(const m of clean.matchAll(/<(?:[\w:]*(?:trkpt|rtept))([^>]+)>([\s\S]*?)<\/(?:[\w:]*(?:trkpt|rtept))>/gi)){
      const attrs=m[1],inner=m[2];
      const latM=attrs.match(/lat=["']([^"']+)["']/i);
      const lonM=attrs.match(/lon=["']([^"']+)["']/i);
      if(!latM||!lonM)continue;
      const lat=parseFloat(latM[1]),lon=parseFloat(lonM[1]);
      if(isNaN(lat)||isNaN(lon))continue;
      const eleM=inner.match(/<(?:[\w:]*ele)[^>]*>([\s\S]*?)<\/(?:[\w:]*ele)>/i);
      points.push({lat,lon,ele:eleM?parseFloat(eleM[1])||0:0,distance:null});
    }
  }

  return{name,points:normalizeDistances(points)};
}
function parseTCX(text){
  const doc=new DOMParser().parseFromString(text.replace(/^\uFEFF/,''),'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('TCX/XMLとして解析できません');
  const name=doc.querySelector('Activity Id')?.textContent?.trim()||doc.querySelector('Name')?.textContent?.trim()||'TCX Activity';
  const points=[];
  doc.querySelectorAll('Trackpoint').forEach(tp=>{
    const lat=parseFloat(tp.querySelector('Position LatitudeDegrees')?.textContent);
    const lon=parseFloat(tp.querySelector('Position LongitudeDegrees')?.textContent);
    if(isNaN(lat)||isNaN(lon))return;
    const ele=parseFloat(tp.querySelector('AltitudeMeters')?.textContent);
    const distance=parseFloat(tp.querySelector('DistanceMeters')?.textContent);
    const timeText=tp.querySelector('Time')?.textContent?.trim();
    const hr=parseFloat(tp.querySelector('HeartRateBpm Value')?.textContent);
    points.push({
      lat,lon,
      ele:Number.isFinite(ele)?ele:0,
      distance:Number.isFinite(distance)?distance:null,
      time:timeText?new Date(timeText).getTime():null,
      hr:Number.isFinite(hr)?hr:null
    });
  });
  return{name,points:normalizeDistances(points)};
}


function enrichSpeed(pts){
  for(let i=0;i<pts.length;i++){
    let j=i;
    while(j>0){
      const dt=(pts[i].time||0)-(pts[j-1].time||0);
      if(dt>=15000||i-(j-1)>=15)break;
      j--;
    }
    if(j===i&&i>0)j=i-1;
    const a=pts[j],b=pts[i];
    if(a&&b&&Number.isFinite(a.time)&&Number.isFinite(b.time)&&b.time>a.time){
      const dt=(b.time-a.time)/1000,dd=Math.max(0,b.dist-a.dist);
      b.speedKmh=(dd/dt)*3.6;
    }else b.speedKmh=null;
  }
  return pts;
}
function clamp01(v){return Math.max(0,Math.min(1,v))}
function fmtPaceFromSpeed(speedKmh){
  if(!Number.isFinite(speedKmh)||speedKmh<=0)return '—';
  const pace=60/speedKmh;
  let min=Math.floor(pace),sec=Math.round((pace-min)*60);
  if(sec>=60){min+=1;sec-=60}
  return `${min}:${String(sec).padStart(2,'0')}/km`;
}
function bearingBetween(a,b){
  const r=Math.PI/180,lat1=a.lat*r,lat2=b.lat*r,dLon=(b.lon-a.lon)*r;
  const y=Math.sin(dLon)*Math.cos(lat2);
  const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function getPointAtDistance(targetDist){
  if(!currentTrack)return null;
  const pts=currentTrack.points,d=Math.max(0,Math.min(currentTrack.dist,targetDist));
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i];
    if(d<=b.dist){
      const seg=b.dist-a.dist||1,r=clamp01((d-a.dist)/seg);
      return {lat:a.lat+(b.lat-a.lat)*r,lon:a.lon+(b.lon-a.lon)*r,ele:a.ele+(b.ele-a.ele)*r,dist:d,hr:b.hr,speedKmh:b.speedKmh,bearing:bearingBetween(a,b)};
    }
  }
  const last=pts[pts.length-1],prev=pts[pts.length-2]||last;
  return {...last,bearing:bearingBetween(prev,last)};
}
function updateMeters(p){
  if(!p||!currentTrack)return;
  posDist.textContent=(p.dist/1000).toFixed(1)+'km';
  posEle.textContent=Math.round(p.ele)+'m';
  posPace.textContent=fmtPaceFromSpeed(p.speedKmh);
  posHr.textContent=Number.isFinite(p.hr)?Math.round(p.hr)+'bpm':'—';
  distFill.style.width=(clamp01((p.dist||0)/(currentTrack.dist||1))*100).toFixed(1)+'%';
  const elePct=(currentTrack.maxEle>currentTrack.minEle)?clamp01((p.ele-currentTrack.minEle)/(currentTrack.maxEle-currentTrack.minEle)):0;
  eleFill.style.width=(elePct*100).toFixed(1)+'%';
  const speed=p.speedKmh;
  paceFill.style.width=((Number.isFinite(speed)&&speed>0?clamp01(speed/15):0)*100).toFixed(1)+'%';
  const hr=p.hr;
  hrFill.style.width=((Number.isFinite(hr)?clamp01((hr-90)/80):0)*100).toFixed(1)+'%';
}
function updateCurrentMarker(p,follow){
  if(!map.getSource('current')){
    map.addSource('current',{type:'geojson',data:{type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:[p.lon,p.lat]}}]}});
    map.addLayer({id:'current-point',type:'circle',source:'current',paint:{'circle-radius':11,'circle-color':'#ff2d55','circle-stroke-color':'#fff','circle-stroke-width':3}});
  }else{
    map.getSource('current').setData({type:'FeatureCollection',features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:[p.lon,p.lat]}}]});
  }
  if(follow){
    const bearing=Number.isFinite(p.bearing)?p.bearing:lastBearing;
    lastBearing=bearing;
    map.easeTo({center:[p.lon,p.lat],bearing,pitch:0,duration:isPlaying?80:220});
  }
}
function updateCurrentPositionByProgress(progress,follow=true){
  if(!currentTrack)return;
  progress=clamp01(progress);
  const p=getPointAtDistance(currentTrack.dist*progress);
  if(!p)return;
  currentDistance=p.dist||0;
  posSlider.value=Math.round(progress*1000);
  updateMeters(p);
  updateCurrentMarker(p,follow);
}
function setPlaying(on){
  isPlaying=on;
  if(on){playEnded=false;playBtn.textContent='⏸'}else playBtn.textContent=playEnded?'↩':'▶';
  playBtn.classList.toggle('playing',on);
}
function stopPlayback(){if(playTimer){clearInterval(playTimer);playTimer=null}setPlaying(false)}
function startPlayback(){
  if(!currentTrack)return;
  stopPlayback();
  playEnded=false;
  setPlaying(true);
  const speed=Number(speedSelect.value)||1,replayDurationMs=30000/speed,startProgress=Number(posSlider.value)/1000,startReal=Date.now();
  playTimer=setInterval(()=>{
    const elapsed=Date.now()-startReal;
    let progress=startProgress+(elapsed/replayDurationMs)*(1-startProgress);
    if(progress>=1){
      progress=1;
      updateCurrentPositionByProgress(progress,true);
      playEnded=true;
      stopPlayback();
      return;
    }
    updateCurrentPositionByProgress(progress,true);
  },50);
}
function togglePlayback(){
  if(playEnded&&!isPlaying){
    posSlider.value=0;
    updateCurrentPositionByProgress(0,true);
    playEnded=false;
    startPlayback();
    return;
  }
  if(!isPlaying&&Number(posSlider.value)>=1000){
    posSlider.value=0;
    updateCurrentPositionByProgress(0,true);
  }
  if(isPlaying)stopPlayback();else startPlayback();
}
function clearTrack(){
  ['current-point','marker-labels','goal-point','start-point','track-line','track-line-outline'].forEach(id=>{
    if(map.getLayer(id))map.removeLayer(id);
  });
  ['current','markers','track'].forEach(id=>{
    if(map.getSource(id))map.removeSource(id);
  });
  currentTrack=null;
  currentBounds=null;
  sName.textContent='—';
  sDist.textContent='—';
  sEle.textContent='—';
}

function addTrack(track){
  clearTrack();

  if(!track.points||track.points.length<2){
    showToast('トラックポイントが見つかりませんでした');
    return;
  }

  track.points=enrichSpeed(track.points);
  const stats=calcStats(track.points);
  track.dist=stats.dist;track.gain=stats.gain;track.minEle=Math.min(...track.points.map(p=>p.ele).filter(Number.isFinite));track.maxEle=Math.max(...track.points.map(p=>p.ele).filter(Number.isFinite));
  currentTrack=track;
  const coords=track.points.map(p=>[p.lon,p.lat]);
  const start=coords[0];
  const goal=coords[coords.length-1];

  map.addSource('track',{
    type:'geojson',
    data:{
      type:'FeatureCollection',
      features:[{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}}]
    }
  });

  map.addLayer({
    id:'track-line-outline',
    type:'line',
    source:'track',
    layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':'#ffffff','line-width':8,'line-opacity':0.95}
  });
  map.addLayer({
    id:'track-line',
    type:'line',
    source:'track',
    layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':'#0078ff','line-width':5,'line-opacity':0.98}
  });

  map.addSource('markers',{
    type:'geojson',
    data:{
      type:'FeatureCollection',
      features:[
        {type:'Feature',properties:{kind:'S'},geometry:{type:'Point',coordinates:start}},
        {type:'Feature',properties:{kind:'G'},geometry:{type:'Point',coordinates:goal}}
      ]
    }
  });
  map.addLayer({
    id:'start-point',
    type:'circle',
    source:'markers',
    filter:['==',['get','kind'],'S'],
    paint:{'circle-radius':11,'circle-color':'#2f80ed','circle-stroke-color':'#111827','circle-stroke-width':3}
  });
  map.addLayer({
    id:'goal-point',
    type:'circle',
    source:'markers',
    filter:['==',['get','kind'],'G'],
    paint:{'circle-radius':11,'circle-color':'#ff6b6b','circle-stroke-color':'#111827','circle-stroke-width':3}
  });
  map.addLayer({
    id:'marker-labels',
    type:'symbol',
    source:'markers',
    layout:{'text-field':['get','kind'],'text-size':12},
    paint:{'text-color':'#111827'}
  });

  let minLon=Infinity,minLat=Infinity,maxLon=-Infinity,maxLat=-Infinity;
  coords.forEach(([lon,lat])=>{
    minLon=Math.min(minLon,lon);maxLon=Math.max(maxLon,lon);
    minLat=Math.min(minLat,lat);maxLat=Math.max(maxLat,lat);
  });
  currentBounds=[[minLon,minLat],[maxLon,maxLat]];
  fitTrack();

  sName.textContent=track.name;
  sDist.textContent=fmtDist(stats.dist);
  sEle.textContent=Math.round(stats.gain)+' m';
  setTimeout(()=>updateCurrentPositionByProgress(0,false),250);
}

function fitTrack(){
  if(!currentBounds)return;
  map.fitBounds(currentBounds,{padding:36,duration:350});
}

function loadFile(file){
  const lower=file.name.toLowerCase();
  if(!lower.endsWith('.gpx')&&!lower.endsWith('.tcx')){
    showToast('GPX/TCXファイルを選択してください');
    return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const track=lower.endsWith('.tcx')?parseTCX(e.target.result):parseGPX(e.target.result);
      if(!track.name||track.name==='GPX Track'||track.name==='TCX Activity'){
        track.name=file.name.replace(/\.(gpx|tcx)$/i,'');
      }
      addTrack(track);
    }catch(err){
      console.error(err);
      showToast('読み込みエラー: '+err.message);
    }
  };
  reader.onerror=()=>showToast('ファイル読み込みに失敗しました');
  reader.readAsText(file,'UTF-8');
}

fileInput.addEventListener('change',e=>{
  const file=e.target.files&&e.target.files[0];
  if(file)loadFile(file);
  e.target.value='';
});
fitBtn.addEventListener('click',fitTrack);
northBtn.addEventListener('click',()=>map.easeTo({bearing:0,pitch:0,duration:300}));
clearBtn.addEventListener('click',()=>{stopPlayback();clearTrack();posSlider.value=0;posDist.textContent='0.0km';posEle.textContent='0m';posPace.textContent='—';posHr.textContent='—';distFill.style.width=eleFill.style.width=paceFill.style.width=hrFill.style.width='0%'});
playBtn.addEventListener('click',togglePlayback);
posSlider.addEventListener('input',()=>{playEnded=false;stopPlayback();updateCurrentPositionByProgress(Number(posSlider.value)/1000,false)});
speedSelect.addEventListener('change',()=>{if(isPlaying)startPlayback()});
</script>
</body>
</html>
