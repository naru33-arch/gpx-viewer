<!DOCTYPE html>
<html lang="ja">
<head>

<title>GPX / TCX Replay Viewer</title>
<!-- build: gpx-distance-only / tcx-time-replay -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:-webkit-fill-available}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#1a1a2e;color:#e6edf3;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
header{position:relative;display:flex;align-items:center;gap:8px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top));background:#16213e;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap}
.logo{font-size:12px;font-weight:800;color:#0078ff;letter-spacing:.03em;white-space:nowrap;margin-right:44px;max-width:calc(100% - 64px);overflow:hidden;text-overflow:ellipsis}
#fileInput{display:block;width:calc(100% - 86px);max-width:260px;padding:8px;border:1px solid #1a5276;border-radius:6px;background:#0f3460;color:#e6edf3;font-size:13px;font-family:inherit}
.stats{display:flex;gap:14px;width:100%;align-items:flex-end;justify-content:flex-start}.stat{text-align:right}.file-stat{max-width:210px}.file-stat .stat-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stat-label{font-size:9px;color:#7d8590;text-transform:uppercase;letter-spacing:.08em}.stat-value{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.stat-value.hi{color:#0078ff}
.clear-btn:hover{background:#1a5276;color:white}
.clear-btn{
  position:absolute;
  top:10px;
  right:12px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid #1a5276;
  background:#0f3460;
  color:#7d8590;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  min-width:36px;
}
.viewer{flex:1;min-height:0;display:grid;grid-template-rows:72% 28%;overflow:hidden}.map-wrap{position:relative;min-height:0;background:#1a1a2e;border-bottom:1px solid #0f3460}#map{width:100%;height:100%}.elevation-wrap{position:relative;min-height:0;background:#111827}#elevationCanvas{width:100%;height:100%;display:block}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(255,107,107,.95);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;display:none;max-width:90vw;text-align:center}.leaflet-container{background:#1a1a2e!important}.leaflet-control-zoom a{background:#16213e!important;color:#e6edf3!important;border-color:#0f3460!important;width:30px!important;height:30px!important;line-height:30px!important}.leaflet-control-attribution{background:rgba(22,33,62,.82)!important;color:#7d8590!important;font-size:9px!important}.leaflet-control-attribution a{color:#7d8590!important}
.controls{flex-shrink:0;background:#111827;border-top:1px solid #0f3460;padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;visibility:hidden;opacity:0;pointer-events:none}.controls.show{visibility:visible;opacity:1;pointer-events:auto}.play-btn{width:38px;height:34px;flex:0 0 38px;border-radius:999px;border:1px solid #1a5276;background:#0f3460;color:#e6edf3;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;appearance:none}.play-btn.playing{background:#0078ff;color:#fff;border-color:#0078ff}#posSlider{width:calc(100% - 52px);flex:1 1 calc(100% - 52px);min-width:180px;accent-color:#0078ff}.pos-info{
  flex:1 1 calc(100% - 50px);
  width:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  font-variant-numeric:tabular-nums;
}
.meter-card{
  position:relative;
  min-height:54px;
  background:linear-gradient(180deg,rgba(15,52,96,.62),rgba(15,52,96,.24));
  border:1px solid rgba(26,82,118,.72);
  border-radius:10px;
  padding:6px 7px 7px;
  overflow:hidden;
}
.meter-card label{
  display:block;
  font-size:9px;
  color:#7d8590;
  letter-spacing:.08em;
  margin-bottom:3px;
}
.meter-card span{
  position:relative;
  z-index:2;
  display:block;
  color:#e6edf3;
  font-weight:900;
  font-size:14px;
  line-height:1.15;
  white-space:nowrap;
}
.meter-bar{
  position:absolute;
  left:7px;
  right:7px;
  bottom:6px;
  height:5px;
  border-radius:999px;
  background:rgba(125,133,144,.24);
  overflow:hidden;
}
.meter-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:#0078ff;
  transition:width .15s linear, background .15s linear;
}
.meter-card.pace .meter-fill{background:#27ae60}
.meter-card.hr .meter-fill{background:#eb5757}
.meter-card.ele .meter-fill{background:#f2c94c}.selects{display:flex;gap:6px;width:100%;align-items:center}.selects select{background:#0f3460;color:#e6edf3;border:1px solid #1a5276;border-radius:6px;padding:6px 8px;font-size:12px}.legend{margin-left:auto;font-size:10px;color:#7d8590;white-space:nowrap}

.replay-btn{
  min-width:72px;
  height:34px;
  border-radius:8px;
  border:1px solid #1a5276;
  background:#0f3460;
  color:#e6edf3;
  font-size:12px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.replay-btn.active{
  background:#0078ff;
  border-color:#0078ff;
  color:#fff;
}
.replay-overlay{display:none!important}
.replay-overlay.show{display:none!important}
.replay-title{
  font-size:13px;
  font-weight:800;
  color:#fff;
  margin-bottom:8px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.replay-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px 12px;
}
.replay-item label{
  display:block;
  font-size:9px;
  color:#7d8590;
  letter-spacing:.08em;
}
.replay-item span{
  display:block;
  font-size:16px;
  font-weight:800;
  color:#0078ff;
  font-variant-numeric:tabular-nums;
}
.replay-item.wide{grid-column:1/3}
.replay-finish{display:none!important}
.replay-finish.show{display:none!important}
.finish-card{
  background:rgba(22,33,62,.92);
  border:1px solid #0f3460;
  border-radius:18px;
  padding:22px 24px;
  min-width:260px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.finish-card .finish-main{
  font-size:34px;
  font-weight:900;
  color:#0078ff;
  letter-spacing:.08em;
  margin-bottom:10px;
}
.finish-card .finish-name{
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}
.finish-card .finish-stats{
  font-size:18px;
  font-weight:800;
  line-height:1.6;
  font-variant-numeric:tabular-nums;
}
body.replay-mode header{
  padding-top:calc(6px + env(safe-area-inset-top));
  padding-bottom:6px;
}

body.replay-mode .stats{
  gap:10px;
}
body.replay-mode .stat-label{
  font-size:8px;
}
body.replay-mode .stat-value{
  font-size:12px;
}


.tile-control{
  position:absolute;
  top:10px;
  right:10px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
}
.tile-toggle,.fit-toggle{
  min-width:46px;
  height:34px;
  padding:0 10px;
  border-radius:999px;
  border:1px solid #1a5276;
  background:rgba(15,52,96,.94);
  color:#e6edf3;
  font-size:12px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.tile-menu{
  display:none;
  flex-direction:column;
  gap:4px;
  background:rgba(22,33,62,.90);
  border:1px solid #0f3460;
  border-radius:8px;
  padding:6px;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  box-shadow:0 4px 16px rgba(0,0,0,.28);
}
.tile-control.open .tile-menu{
  display:flex;
}
.tile-menu button{
  min-width:74px;
  padding:5px 7px;
  border-radius:6px;
  border:1px solid #1a5276;
  background:#0f3460;
  color:#7d8590;
  font-size:10px;
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.tile-menu button.active{
  color:#fff;
  background:#0078ff;
  border-color:#0078ff;
}

.fit-toggle{
  margin-top:2px;
  background:rgba(15,52,96,.88);
}
.fit-toggle:active,.tile-toggle:active{
  transform:scale(.97);
}


.view3d-btn{
  height:31px;
  min-width:46px;
  border-radius:8px;
  border:1px solid #1a5276;
  background:#0f3460;
  color:#e6edf3;
  font-size:12px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.view3d-btn.active{
  background:#0078ff;
  border-color:#0078ff;
  color:#fff;
}
body.profile-3d .elevation-wrap{
  background:radial-gradient(circle at 50% 15%,#1f2d46 0%,#111827 58%,#0b1020 100%);
}

</style>
</head>
<body>
<header><div class="logo">GPX / TCX Replay Viewer</div><input type="file" id="fileInput" accept=".gpx,.tcx,*/*"><div class="stats" id="statsWrap" style="display:none"><div class="stat file-stat"><div class="stat-label">ファイル名</div><div class="stat-value" id="sName">—</div></div><div class="stat"><div class="stat-label">距離</div><div class="stat-value hi" id="sDist">—</div></div><div class="stat"><div class="stat-label">獲得標高</div><div class="stat-value" id="sEle">—</div></div></div><button class="clear-btn" id="clearBtn" style="display:none">✕</button></header>
<div class="viewer"><div class="map-wrap">
    <div id="map"></div>
    <div class="replay-overlay" id="replayOverlay">
      <div class="replay-title" id="replayTitle">REPLAY</div>
      <div class="replay-grid">
        <div class="replay-item"><label>DIST</label><span id="replayDist">0.0km</span></div>
        <div class="replay-item"><label>ELEV</label><span id="replayEle">0m</span></div>
        <div class="replay-item"><label>PACE</label><span id="replayPace">—</span></div>
        <div class="replay-item"><label>HR</label><span id="replayHr">—</span></div>
        <div class="replay-item wide"><label>PROGRESS</label><span id="replayProgress">0%</span></div>
      </div>
    </div>
    <div class="replay-finish" id="replayFinish">
      <div class="finish-card">
        <div class="finish-main">FINISH</div>
        <div class="finish-name" id="finishName">—</div>
        <div class="finish-stats" id="finishStats">—</div>
      </div>
    </div>
    <div class="tile-control" id="tileControl">
      <button type="button" class="tile-toggle" id="tileToggle">地図</button>
      <button type="button" class="fit-toggle" id="fitBtn">全体</button>
      <div class="tile-menu" id="tileMenu">
        <button type="button" data-tile="gsi_std" class="active">地理院 標準</button>
        <button type="button" data-tile="gsi_pale">地理院 淡色</button>
        <button type="button" data-tile="gsi_photo">地理院 写真</button>
        <button type="button" data-tile="osm">OSM</button>
        <button type="button" data-tile="opentopo">Topo</button>
      </div>
    </div>
  </div><div class="elevation-wrap"><canvas id="elevationCanvas"></canvas></div></div>
<div class="controls" id="controls"><button class="play-btn" id="playBtn" type="button">▶</button><div class="pos-info">
    <div class="meter-card dist"><label>DIST</label><span id="posDist">0.0km</span><div class="meter-bar"><div class="meter-fill" id="distFill"></div></div></div>
    <div class="meter-card ele"><label>ELEV</label><span id="posEle">0m</span><div class="meter-bar"><div class="meter-fill" id="eleFill"></div></div></div>
    <div class="meter-card pace"><label>PACE</label><span id="posPace">—</span><div class="meter-bar"><div class="meter-fill" id="paceFill"></div></div></div>
    <div class="meter-card hr"><label>HR</label><span id="posHr">—</span><div class="meter-bar"><div class="meter-fill" id="hrFill"></div></div></div>
  </div><input type="range" id="posSlider" min="0" max="1000" value="0"><div class="selects"><button class="view3d-btn" id="view3dBtn" type="button">3D</button><select id="speedSelect">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
    </select><select id="colorMode"><option value="single">単色</option><option value="run" selected>ラン（ペース）</option><option value="trail">トレラン（速度）</option><option value="hr">心拍</option></select><div class="legend" id="legend">ラン: 青=〜5:00/km 緑=〜6:00 黄=〜7:00 赤=7:00超 / 1x=30秒</div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
const fileInput=document.getElementById('fileInput'),elevationCanvas=document.getElementById('elevationCanvas'),statsWrap=document.getElementById('statsWrap'),clearBtn=document.getElementById('clearBtn'),controls=document.getElementById('controls'),playBtn=document.getElementById('playBtn'),posSlider=document.getElementById('posSlider'),posDist=document.getElementById('posDist'),posEle=document.getElementById('posEle'),posPace=document.getElementById('posPace'),posHr=document.getElementById('posHr'),distFill=document.getElementById('distFill'),eleFill=document.getElementById('eleFill'),paceFill=document.getElementById('paceFill'),hrFill=document.getElementById('hrFill'),speedSelect=document.getElementById('speedSelect'),colorMode=document.getElementById('colorMode'),view3dBtn=document.getElementById('view3dBtn'),legend=document.getElementById('legend'),
replayOverlay=document.getElementById('replayOverlay'),
replayTitle=document.getElementById('replayTitle'),
replayDist=document.getElementById('replayDist'),
replayEle=document.getElementById('replayEle'),
replayPace=document.getElementById('replayPace'),
replayHr=document.getElementById('replayHr'),
replayProgress=document.getElementById('replayProgress'),
replayFinish=document.getElementById('replayFinish'),
finishName=document.getElementById('finishName'),
finishStats=document.getElementById('finishStats');
let tracks=[],mapLayers=[],currentMarker=null,currentDistance=0,playTimer=null,isPlaying=false,playStartReal=0,playStartActivity=0,allBounds=null,profile3DMode=false,isReplayMode=false,playEnded=false;
const DEFAULT_COLOR='#0078ff';
const map=L.map('map',{center:[36.2,138.2],zoom:5,zoomControl:true,attributionControl:true});
const TILE_DEFS={
  gsi_std:{
    url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
    options:{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18}
  },
  gsi_pale:{
    url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    options:{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18}
  },
  gsi_photo:{
    url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
    options:{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18}
  },
  osm:{
    url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    options:{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}
  },
  opentopo:{
    url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    options:{attribution:'&copy; OpenStreetMap contributors, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',maxZoom:17}
  }
};
let currentTileLayer=null;
function setBaseTile(key){
  const def=TILE_DEFS[key]||TILE_DEFS.gsi_std;
  if(currentTileLayer)map.removeLayer(currentTileLayer);
  currentTileLayer=L.tileLayer(def.url,def.options).addTo(map);
  document.querySelectorAll('#tileMenu button').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.tile===key);
  });
}
setBaseTile('gsi_std');
function fitTrackBounds(){
  if(allBounds&&allBounds.isValid()){
    map.fitBounds(allBounds,{padding:[34,34],animate:false});
  }
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none'},4000)}
function fmtDist(m){return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}
function haversine(a,b){const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r,s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))}
function enrichPoints(pts){let dist=0;return pts.map((p,i)=>{if(i>0)dist+=haversine(pts[i-1],p);return {...p,dist:Number.isFinite(p.distance)?p.distance:dist}})}

function normalizeDistances(pts){
  if(!pts||!pts.length)return [];
  const hasDistance=pts.some(p=>Number.isFinite(p.distance)&&p.distance>0);
  if(hasDistance){
    let last=0;
    return pts.map((p,i)=>{
      let d=Number.isFinite(p.distance)?p.distance:last;
      if(i>0&&d<last)d=last;
      last=d;
      return {...p,dist:d};
    });
  }
  let dist=0;
  return pts.map((p,i)=>{
    if(i>0)dist+=haversine(pts[i-1],p);
    return {...p,dist};
  });
}
function calcStats(pts){let dist=pts.length?pts[pts.length-1].dist:0,gain=0;for(let i=1;i<pts.length;i++){const d=pts[i].ele-pts[i-1].ele;if(d>0)gain+=d}return{dist,gain}}
function simplifyPoints(points,maxPoints){if(!points||points.length<=maxPoints)return points;const step=Math.ceil(points.length/maxPoints),out=[];for(let i=0;i<points.length;i+=step)out.push(points[i]);const last=points[points.length-1];if(out[out.length-1]!==last)out.push(last);return out}
function prepareCanvas(canvas){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,width:rect.width,height:rect.height}}
function parseGPX(text){
  const clean=text.replace(/^\uFEFF/,'');
  const xml=clean
    .replace(/\s+xmlns[^=]*="[^"]*"/g,'')
    .replace(/<([a-zA-Z]+:[a-zA-Z])/g,m=>'<'+m.slice(m.indexOf(':')+1))
    .replace(/<\/([a-zA-Z]+:[a-zA-Z])/g,m=>'</'+m.slice(m.indexOf(':')+1));

  let points=[],name='トラック';

  try{
    const doc=new DOMParser().parseFromString(xml,'application/xml');

    if(!doc.querySelector('parsererror')){
      name=doc.querySelector('trk > name, rte > name, name')?.textContent?.trim()||name;

      doc.querySelectorAll('trkpt, rtept').forEach(p=>{
        const lat=parseFloat(p.getAttribute('lat'));
        const lon=parseFloat(p.getAttribute('lon'));

        if(!isNaN(lat)&&!isNaN(lon)){
          const eleText=p.querySelector('ele')?.textContent;
          const timeText=p.querySelector('time')?.textContent?.trim();

          points.push({
            lat,
            lon,
            ele:Number.isFinite(parseFloat(eleText))?parseFloat(eleText):0,
            time:null,
            hr:null,
            distance:null
          });
        }
      });
    }
  }catch(_){}

  if(points.length===0){
    const nm=clean.match(/<name[^>]*>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/name>/i);
    if(nm)name=nm[1].trim();

    for(const m of clean.matchAll(/<(?:[\w:]*(?:trkpt|rtept))([^>]+)>([\s\S]*?)<\/(?:[\w:]*(?:trkpt|rtept))>/gi)){
      const attrs=m[1];
      const inner=m[2];

      const latM=attrs.match(/lat=["']([^"']+)["']/i);
      const lonM=attrs.match(/lon=["']([^"']+)["']/i);

      if(!latM||!lonM)continue;

      const lat=parseFloat(latM[1]);
      const lon=parseFloat(lonM[1]);

      if(isNaN(lat)||isNaN(lon))continue;

      const eleM=inner.match(/<(?:[\w:]*ele)[^>]*>([\s\S]*?)<\/(?:[\w:]*ele)>/i);
      const timeM=inner.match(/<(?:[\w:]*time)[^>]*>([\s\S]*?)<\/(?:[\w:]*time)>/i);

      points.push({
        lat,
        lon,
        ele:eleM?parseFloat(eleM[1])||0:0,
        time:null,
        hr:null,
        distance:null
      });
    }
  }

  }
}

function updateCurrentPositionFromSlider(){
  updateCurrentPositionByProgress(Number(posSlider.value)/1000);
}
function setPlaying(on){
  isPlaying=on;
  if(on){
    playEnded=false;
    playBtn.textContent='⏸';
  }else{
    playBtn.textContent=playEnded?'↩':'▶';
  }
  playBtn.classList.toggle('playing',on);
}
function stopPlayback(){if(playTimer){clearInterval(playTimer);playTimer=null}setPlaying(false)}
function startPlayback(){
  if(!tracks.length)return;
  stopPlayback();
  playEnded=false;
  setPlaying(true);

  // 1x = 全コース30秒で再生。
  // 0.5x = 60秒、2x = 15秒、4x = 7.5秒。
  // TCXは実際のTime比率を保ったまま30秒へ圧縮。
  // GPXは距離比率で30秒再生。
  const speed=Number(speedSelect.value)||1;
  const replayDurationMs=30000/speed;

  const startSlider=Number(posSlider.value)||0;
  const startProgress=startSlider/1000;
  const startReal=Date.now();

  playTimer=setInterval(()=>{
    const elapsedReal=Date.now()-startReal;
    let progress=startProgress+(elapsedReal/replayDurationMs)*(1-startProgress);

    if(progress>=1){
      progress=1;
      posSlider.value=1000;
      updateCurrentPositionByProgress(progress);
      playEnded=true;
      stopPlayback();
      showFinishOverlay();
      return;
    }

    posSlider.value=Math.round(progress*1000);
    updateCurrentPositionByProgress(progress);
  },50);
}
function togglePlayback(){if(isPlaying)stopPlayback();else startPlayback()}
function loadFile(file){playEnded=false;stopPlayback();const lower=file.name.toLowerCase();if(!lower.endsWith('.gpx')&&!lower.endsWith('.tcx')){showToast(`${file.name} はGPX/TCXファイルではありません`);return}const reader=new FileReader();reader.onload=e=>{try{const parsed=lower.endsWith('.tcx')?parseTCX(e.target.result):parseGPX(e.target.result);let points=enrichSpeed(parsed.points);if(points.length<2){showToast(`${file.name}: トラックポイントが見つかりませんでした`);return}const {dist,gain}=calcStats(points),times=points.map(p=>p.time).filter(v=>Number.isFinite(v)),hasTime=(parsed.type==='tcx'&&times.length>=2),startTime=hasTime?times[0]:null,endTime=hasTime?times[times.length-1]:null,elapsed=hasTime?(endTime-startTime)/1000:0,track={name:parsed.name,points,dist,gain,type:parsed.type,hasTime,startTime,endTime,elapsed};mapLayers.forEach(layer=>map.removeLayer(layer));tracks=[];mapLayers=[];allBounds=null,isReplayMode=false,playEnded=false;currentMarker=null;currentDistance=0;tracks.push(track);addTrackToMap(track);controls.classList.add('show');posSlider.value=0;updateUI(track);updateLegend();replayFinish.classList.remove('show');updateCurrentPositionFromSlider();setTimeout(()=>{map.invalidateSize();fitTrackBounds()},120)}catch(err){console.error(err);showToast(`読み込みエラー: ${err.message}`)}};reader.onerror=()=>showToast(`${file.name}: 読み込みに失敗しました`);reader.readAsText(file,'UTF-8')}
document.getElementById('tileToggle').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('tileControl').classList.toggle('open');
});
document.querySelectorAll('#tileMenu button').forEach(btn=>btn.addEventListener('click',e=>{
  e.stopPropagation();
  setBaseTile(btn.dataset.tile);
  document.getElementById('tileControl').classList.remove('open');
}));
document.addEventListener('click',e=>{
  const tc=document.getElementById('tileControl');
  if(tc&&!tc.contains(e.target))tc.classList.remove('open');
});
view3dBtn.addEventListener('click',()=>{
  profile3DMode=!profile3DMode;
  document.body.classList.toggle('profile-3d',profile3DMode);
  view3dBtn.classList.toggle('active',profile3DMode);
  drawElevation(tracks,currentDistance);
});
document.getElementById('fitBtn').addEventListener('click',e=>{e.stopPropagation();fitTrackBounds()});
posSlider.addEventListener('input',()=>{playEnded=false;stopPlayback();updateCurrentPositionFromSlider()});playBtn.addEventListener('click',()=>{
  if(playEnded&&!isPlaying){
    posSlider.value=0;
    updateCurrentPositionByProgress(0);
    playEnded=false;
    startPlayback();
    return;
  }
  if(!isPlaying&&Number(posSlider.value)>=1000){
    posSlider.value=0;
    updateCurrentPositionByProgress(0);
  }
  togglePlayback();
});speedSelect.addEventListener('change',()=>{if(isPlaying)startPlayback()});colorMode.addEventListener('change',()=>{updateLegend();redrawMapTracks();updateCurrentPositionFromSlider()});fileInput.addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(file)loadFile(file);e.target.value=''});clearBtn.addEventListener('click',()=>{playEnded=false;stopPlayback();mapLayers.forEach(layer=>map.removeLayer(layer));tracks=[];mapLayers=[];currentMarker=null;allBounds=null,isReplayMode=false,playEnded=false;controls.classList.remove('show');replayOverlay.classList.remove('show');replayFinish.classList.remove('show');statsWrap.style.display='none';clearBtn.style.display='none';posSlider.value=0;posDist.textContent='0.0km';posEle.textContent='0m';posPace.textContent='—';posHr.textContent='—';distFill.style.width='0%';eleFill.style.width='0%';paceFill.style.width='0%';hrFill.style.width='0%';drawElevation(tracks)});window.addEventListener('resize',()=>setTimeout(()=>{map.invalidateSize();drawElevation(tracks,currentDistance)},100));drawElevation(tracks);
})();
</script></body></html>
