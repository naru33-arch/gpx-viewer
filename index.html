<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GPX Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;height:-webkit-fill-available}body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#1a1a2e;color:#e6edf3;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}header{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:#16213e;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap}.logo{font-size:13px;font-weight:700;color:#e8ff60;letter-spacing:.06em;white-space:nowrap;margin-right:4px}#fileInput{display:block;width:100%;max-width:260px;padding:8px;border:1px solid #1a5276;border-radius:6px;background:#0f3460;color:#e6edf3;font-size:13px;font-family:inherit}.stats{display:flex;gap:14px;margin-left:auto}.stat{text-align:right}.stat-label{font-size:9px;color:#7d8590;text-transform:uppercase;letter-spacing:.08em}.stat-value{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.stat-value.hi{color:#e8ff60}.clear-btn{padding:7px 12px;background:none;border:1px solid #1a5276;border-radius:6px;color:#7d8590;font-size:11px;font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;white-space:nowrap}.status{width:100%;color:#7d8590;font-size:11px;line-height:1.4}.viewer{flex:1;min-height:0;display:grid;grid-template-rows:70% 30%;overflow:hidden}.map-wrap{position:relative;min-height:0;background:#1a1a2e;border-bottom:1px solid #0f3460}#map{width:100%;height:100%}.elevation-wrap{position:relative;min-height:0;background:#111827}#elevationCanvas{width:100%;height:100%;display:block}.info-panel{position:absolute;bottom:16px;left:12px;z-index:1000;background:rgba(22,33,62,.94);border:1px solid #0f3460;border-radius:8px;padding:10px 12px;min-width:190px;max-width:calc(100vw - 24px);font-size:12px;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.info-panel.show{opacity:1;transform:translateY(0)}.info-name{font-size:12px;font-weight:700;color:#e8ff60;margin-bottom:8px;word-break:break-all}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info-item label{display:block;font-size:9px;color:#7d8590;text-transform:uppercase;letter-spacing:.06em}.info-item span{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(255,107,107,.95);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;display:none;max-width:90vw;text-align:center}.leaflet-container{background:#1a1a2e!important}.leaflet-control-zoom a{background:#16213e!important;color:#e6edf3!important;border-color:#0f3460!important;width:30px!important;height:30px!important;line-height:30px!important}.leaflet-control-attribution{background:rgba(22,33,62,.82)!important;color:#7d8590!important;font-size:9px!important}.leaflet-control-attribution a{color:#7d8590!important}.gpx-popup .leaflet-popup-content-wrapper{background:#16213e;border:1px solid #0f3460;border-radius:6px;color:#e6edf3}.gpx-popup .leaflet-popup-tip{background:#16213e}.gpx-popup .leaflet-popup-content{margin:10px 14px;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="logo">GPX//VIEWER</div>
  <input type="file" id="fileInput" accept="*/*">
  <div class="stats" id="statsWrap" style="display:none">
    <div class="stat"><div class="stat-label">距離</div><div class="stat-value hi" id="sDist">—</div></div>
    <div class="stat"><div class="stat-label">獲得標高</div><div class="stat-value" id="sEle">—</div></div>
  </div>
  <button class="clear-btn" id="clearBtn" style="display:none">クリア</button>
  <div class="status" id="status">GPXファイルを選択してください。</div>
</header>
<div class="viewer">
  <div class="map-wrap"><div id="map"></div><div class="info-panel" id="infoPanel"><div class="info-name" id="iName"></div><div class="info-grid"><div class="info-item"><label>距離</label><span id="iDist">—</span></div><div class="info-item"><label>獲得標高</label><span id="iEle">—</span></div></div></div></div>
  <div class="elevation-wrap"><canvas id="elevationCanvas"></canvas></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
const fileInput=document.getElementById('fileInput'), elevationCanvas=document.getElementById('elevationCanvas'), statsWrap=document.getElementById('statsWrap'), clearBtn=document.getElementById('clearBtn'), infoPanel=document.getElementById('infoPanel'), statusEl=document.getElementById('status');
const COLORS=['#e8ff60','#ff6b6b','#60d4ff','#ff9f43','#a29bfe','#55efc4']; let tracks=[],mapLayers=[],colorIdx=0,allBounds=null;
const map=L.map('map',{center:[36.2,138.2],zoom:5,zoomControl:true,attributionControl:true});
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18}).addTo(map);
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none'},4000)}
function setStatus(msg){statusEl.textContent=msg} function fmtDist(m){return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}
function haversine(a,b){const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r,s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))}
function enrichPoints(pts){let dist=0;return pts.map((p,i)=>{if(i>0)dist+=haversine(pts[i-1],p);return {...p,dist}})}
function calcStats(pts){let dist=0,gain=0;for(let i=1;i<pts.length;i++){dist+=haversine(pts[i-1],pts[i]);const d=pts[i].ele-pts[i-1].ele;if(d>0)gain+=d}return{dist,gain}}
function simplifyPoints(points,maxPoints){if(!points||points.length<=maxPoints)return points;const step=Math.ceil(points.length/maxPoints),out=[];for(let i=0;i<points.length;i+=step)out.push(points[i]);const last=points[points.length-1];if(out[out.length-1]!==last)out.push(last);return out}
function prepareCanvas(canvas){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,width:rect.width,height:rect.height}}
function parseGPX(text){const clean=text.replace(/^\uFEFF/,'');const xml=clean.replace(/\s+xmlns[^=]*="[^"]*"/g,'').replace(/<([a-zA-Z]+:[a-zA-Z])/g,m=>'<'+m.slice(m.indexOf(':')+1)).replace(/<\/([a-zA-Z]+:[a-zA-Z])/g,m=>'</'+m.slice(m.indexOf(':')+1));let points=[],name='トラック';try{const doc=new DOMParser().parseFromString(xml,'application/xml');if(!doc.querySelector('parsererror')){name=doc.querySelector('trk > name, rte > name, name')?.textContent?.trim()||name;doc.querySelectorAll('trkpt, rtept').forEach(p=>{const lat=parseFloat(p.getAttribute('lat')),lon=parseFloat(p.getAttribute('lon'));if(!isNaN(lat)&&!isNaN(lon)){const eleText=p.querySelector('ele')?.textContent;points.push({lat,lon,ele:Number.isFinite(parseFloat(eleText))?parseFloat(eleText):0,time:p.querySelector('time')?.textContent?.trim()||null})}})}}catch(_){}
if(points.length===0){const nm=clean.match(/<name[^>]*>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/name>/i);if(nm)name=nm[1].trim();for(const m of clean.matchAll(/<(?:[\w:]*(?:trkpt|rtept))([^>]+)>([\s\S]*?)<\/(?:[\w:]*(?:trkpt|rtept))>/gi)){const attrs=m[1],inner=m[2],latM=attrs.match(/lat="([^"]+)"/),lonM=attrs.match(/lon="([^"]+)"/);if(!latM||!lonM)continue;const lat=parseFloat(latM[1]),lon=parseFloat(lonM[1]);if(isNaN(lat)||isNaN(lon))continue;const eleM=inner.match(/<(?:[\w:]*ele)[^>]*>([\s\S]*?)<\/(?:[\w:]*ele)>/i);points.push({lat,lon,ele:eleM?parseFloat(eleM[1])||0:0})}}return{name,points}}
function makeMarker(color,label){return L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50%;background:${color};border:2px solid #1a1a2e;color:#1a1a2e;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px ${color}66;">${label}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}
function addTrackToMap(track){const latlngs=simplifyPoints(track.points,6000).map(p=>[p.lat,p.lon]);const poly=L.polyline(latlngs,{color:track.color,weight:5,opacity:.95,lineJoin:'round',lineCap:'round'}).addTo(map);poly.bindPopup(`<b style="color:${track.color}">${track.name}</b><br>距離: ${fmtDist(track.dist)}<br>獲得標高: ${Math.round(track.gain)} m`,{className:'gpx-popup'});const start=track.points[0],goal=track.points[track.points.length-1],startM=L.marker([start.lat,start.lon],{icon:makeMarker('#60d4ff','S')}).addTo(map),goalM=L.marker([goal.lat,goal.lon],{icon:makeMarker('#ff6b6b','G')}).addTo(map);mapLayers.push(poly,startM,goalM);const b=poly.getBounds();allBounds=allBounds?allBounds.extend(b):b;if(allBounds&&allBounds.isValid())map.fitBounds(allBounds,{padding:[32,32]})}
function drawElevation(trackList){const {ctx,width,height}=prepareCanvas(elevationCanvas);ctx.clearRect(0,0,width,height);ctx.fillStyle='#111827';ctx.fillRect(0,0,width,height);ctx.fillStyle='#7d8590';ctx.font='10px -apple-system, Helvetica Neue, Arial, sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('ELEVATION PROFILE',12,8);if(!trackList.length){ctx.font='13px -apple-system, Helvetica Neue, Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GPXを読み込むと高低図を表示します',width/2,height/2);return}const padL=48,padR=16,padT=28,padB=26,plotW=Math.max(1,width-padL-padR),plotH=Math.max(1,height-padT-padB);let minEle=Infinity,maxEle=-Infinity,eleCount=0,totalDist=0;for(const t of trackList){totalDist+=t.dist||0;for(const p of t.points){if(Number.isFinite(p.ele)){if(p.ele<minEle)minEle=p.ele;if(p.ele>maxEle)maxEle=p.ele;eleCount++}}}if(eleCount<2||totalDist<=0)return;if(maxEle-minEle<1){maxEle+=.5;minEle-=.5}const eleRange=maxEle-minEle;ctx.strokeStyle='rgba(125,133,144,0.25)';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=padT+plotH*i/4;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(width-padR,y);ctx.stroke()}ctx.fillStyle='#7d8590';ctx.font='10px -apple-system, Helvetica Neue, Arial, sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(Math.round(maxEle)+'m',padL-6,padT);ctx.fillText(Math.round(minEle)+'m',padL-6,padT+plotH);ctx.textBaseline='top';ctx.textAlign='left';ctx.fillText('0km',padL,height-padB+8);ctx.textAlign='right';ctx.fillText((totalDist/1000).toFixed(1)+'km',width-padR,height-padB+8);let distOffset=0;for(const t of trackList){const pts=simplifyPoints(t.points,5000);ctx.beginPath();pts.forEach((p,i)=>{const x=padL+((distOffset+p.dist)/totalDist)*plotW,y=padT+((maxEle-p.ele)/eleRange)*plotH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle=t.color;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();distOffset+=t.dist}}
function updateUI(last){const has=tracks.length>0;statsWrap.style.display=has?'flex':'none';clearBtn.style.display=has?'':'none';if(!has){infoPanel.classList.remove('show');return}const totalDist=tracks.reduce((s,t)=>s+t.dist,0),totalGain=tracks.reduce((s,t)=>s+t.gain,0);document.getElementById('sDist').textContent=fmtDist(totalDist);document.getElementById('sEle').textContent=Math.round(totalGain)+' m';if(last){document.getElementById('iName').textContent=last.name;document.getElementById('iDist').textContent=fmtDist(last.dist);document.getElementById('iEle').textContent=Math.round(last.gain)+' m';infoPanel.classList.add('show')}}
function loadFile(file){if(!file.name.toLowerCase().endsWith('.gpx')){showToast(`${file.name} はGPXファイルではありません`);return}setStatus(`${file.name} を読み込み中...`);const reader=new FileReader();reader.onload=e=>{try{const {name,points:rawPoints}=parseGPX(e.target.result);if(rawPoints.length<2){showToast(`${file.name}: トラックポイントが見つかりませんでした`);setStatus('読み込み失敗');return}const points=enrichPoints(rawPoints),{dist,gain}=calcStats(points),color=COLORS[colorIdx++%COLORS.length],track={name,points,dist,gain,color};tracks.push(track);addTrackToMap(track);drawElevation(tracks);updateUI(track);setStatus(`${file.name} を表示しました。 ${points.length.toLocaleString()}点`)}catch(err){console.error(err);showToast(`読み込みエラー: ${err.message}`);setStatus(`読み込みエラー: ${err.message}`)}};reader.onerror=()=>{showToast(`${file.name}: 読み込みに失敗しました`);setStatus('読み込み失敗')};reader.readAsText(file,'UTF-8')}
fileInput.addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file){setStatus('ファイルが選択されませんでした。');return}loadFile(file);e.target.value=''});clearBtn.addEventListener('click',()=>{mapLayers.forEach(layer=>map.removeLayer(layer));tracks=[];mapLayers=[];colorIdx=0;allBounds=null;updateUI(null);drawElevation(tracks);setStatus('クリアしました。')});window.addEventListener('resize',()=>{setTimeout(()=>{map.invalidateSize();drawElevation(tracks)},100)});drawElevation(tracks);
})();
</script>
</body>
</html>
