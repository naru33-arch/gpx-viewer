<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GPX Viewer Standalone</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  height: -webkit-fill-available;
}

body {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: #1a1a2e;
  color: #e6edf3;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: #16213e;
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.logo {
  font-size: 13px;
  font-weight: 700;
  color: #e8ff60;
  letter-spacing: 0.06em;
  white-space: nowrap;
  margin-right: 4px;
}

.upload-wrap { position: relative; }

.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: #0f3460;
  border: 1px solid #1a5276;
  border-radius: 6px;
  color: #e6edf3;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  -webkit-appearance: none;
  appearance: none;
}

.upload-btn:active { opacity: 0.7; }

#fileInput {
  display: block;
  width: 100%;
  max-width: 260px;
  padding: 8px;
  border: 1px solid #1a5276;
  border-radius: 6px;
  background: #0f3460;
  color: #e6edf3;
  font-size: 13px;
  font-family: inherit;
}

.stats {
  display: flex;
  gap: 14px;
  margin-left: auto;
}

.stat { text-align: right; }

.stat-label {
  font-size: 9px;
  color: #7d8590;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.stat-value {
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.stat-value.hi { color: #e8ff60; }

.clear-btn {
  padding: 7px 12px;
  background: none;
  border: 1px solid #1a5276;
  border-radius: 6px;
  color: #7d8590;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  white-space: nowrap;
}

.viewer {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-rows: 70% 30%;
  overflow: hidden;
}

.track-wrap {
  position: relative;
  min-height: 0;
  background: #1a1a2e;
  border-bottom: 1px solid #0f3460;
}

.elevation-wrap {
  position: relative;
  min-height: 0;
  background: #111827;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.info-panel {
  position: absolute;
  bottom: 16px;
  left: 12px;
  z-index: 10;
  background: rgba(22,33,62,0.95);
  border: 1px solid #0f3460;
  border-radius: 8px;
  padding: 10px 12px;
  min-width: 185px;
  max-width: calc(100vw - 24px);
  font-size: 12px;
  opacity: 0;
  transform: translateY(6px);
  transition: all 0.25s;
  pointer-events: none;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

.info-panel.show {
  opacity: 1;
  transform: translateY(0);
}

.info-name {
  font-size: 12px;
  font-weight: 700;
  color: #e8ff60;
  margin-bottom: 7px;
  word-break: break-all;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.info-item label {
  display: block;
  font-size: 9px;
  color: #7d8590;
  text-transform: uppercase;
}

.info-item span {
  font-size: 12px;
  font-weight: 600;
}

.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,107,107,0.95);
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 9999;
  display: none;
  max-width: 90vw;
  text-align: center;
}

.status {
  width: 100%;
  color: #7d8590;
  font-size: 11px;
  line-height: 1.4;
}
</style>
</head>
<body>

<header>
  <div class="logo">GPX//VIEWER</div>

  <div class="upload-wrap">
    <input type="file" id="fileInput" accept="*/*" multiple>
  </div>

  <div class="stats" id="statsWrap" style="display:none">
    <div class="stat"><div class="stat-label">距離</div><div class="stat-value hi" id="sDist">—</div></div>
    <div class="stat"><div class="stat-label">平均ペース</div><div class="stat-value" id="sPace">—</div></div>
    <div class="stat"><div class="stat-label">獲得標高</div><div class="stat-value" id="sEle">—</div></div>
  </div>

  <button class="clear-btn" id="clearBtn" style="display:none">クリア</button>
  <div class="status" id="status">外部ライブラリなし・標準ファイル選択欄版です。</div>
</header>

<div class="viewer">
  <div class="track-wrap">
    <canvas id="trackCanvas"></canvas>
    <div class="info-panel" id="infoPanel">
      <div class="info-name" id="iName"></div>
      <div class="info-grid">
        <div class="info-item"><label>距離</label><span id="iDist">—</span></div>
        <div class="info-item"><label>平均ペース</label><span id="iPace">—</span></div>
        <div class="info-item"><label>獲得標高</label><span id="iEle">—</span></div>
        <div class="info-item"><label>開始時刻</label><span id="iTime">—</span></div>
      </div>
    </div>
  </div>
  <div class="elevation-wrap">
    <canvas id="elevationCanvas"></canvas>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// ============================================================
//  GPX Parser
// ============================================================
function parseGPX(text) {
  const clean = text.replace(/^\uFEFF/, '');

  const xml = clean
    .replace(/\s+xmlns[^=]*="[^"]*"/g, '')
    .replace(/<([a-zA-Z]+:[a-zA-Z])/g, m => '<' + m.slice(m.indexOf(':')+1))
    .replace(/<\/([a-zA-Z]+:[a-zA-Z])/g, m => '</' + m.slice(m.indexOf(':')+1));

  let points = [], name = 'トラック';

  try {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (!doc.querySelector('parsererror')) {
      name = doc.querySelector('trk > name, rte > name, name')?.textContent?.trim() || name;
      const ptEls = doc.querySelectorAll('trkpt, rtept');
      if (ptEls.length > 0) {
        ptEls.forEach(p => {
          const lat = parseFloat(p.getAttribute('lat'));
          const lon = parseFloat(p.getAttribute('lon'));
          if (!isNaN(lat) && !isNaN(lon)) {
            const eleText = p.querySelector('ele')?.textContent;
            points.push({
              lat, lon,
              ele: Number.isFinite(parseFloat(eleText)) ? parseFloat(eleText) : 0,
              time: p.querySelector('time')?.textContent?.trim() || null,
            });
          }
        });
      }
    }
  } catch(_) {}

  if (points.length === 0) {
    const nm = clean.match(/<name[^>]*>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/name>/i);
    if (nm) name = nm[1].trim();

    for (const m of clean.matchAll(/<(?:[\w:]*(?:trkpt|rtept))([^>]+)>([\s\S]*?)<\/(?:[\w:]*(?:trkpt|rtept))>/gi)) {
      const attrs = m[1], inner = m[2];
      const latM = attrs.match(/lat="([^"]+)"/);
      const lonM = attrs.match(/lon="([^"]+)"/);
      if (!latM || !lonM) continue;

      const lat = parseFloat(latM[1]);
      const lon = parseFloat(lonM[1]);
      if (isNaN(lat) || isNaN(lon)) continue;

      const eleM  = inner.match(/<(?:[\w:]*ele)[^>]*>([\s\S]*?)<\/(?:[\w:]*ele)>/i);
      const timeM = inner.match(/<(?:[\w:]*time)[^>]*>([\s\S]*?)<\/(?:[\w:]*time)>/i);

      points.push({
        lat, lon,
        ele: eleM ? parseFloat(eleM[1]) || 0 : 0,
        time: timeM ? timeM[1].trim() : null,
      });
    }
  }

  return { name, points };
}

// ============================================================
//  Stats
// ============================================================
function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r;
  const dLon = (b.lon - a.lon) * r;
  const s =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

function enrichPoints(pts) {
  let dist = 0;
  return pts.map((p, i) => {
    if (i > 0) dist += haversine(pts[i - 1], p);
    return { ...p, dist };
  });
}

function calcStats(pts) {
  let dist = 0, gain = 0;
  for (let i = 1; i < pts.length; i++) {
    dist += haversine(pts[i - 1], pts[i]);
    const d = pts[i].ele - pts[i - 1].ele;
    if (d > 0) gain += d;
  }

  const start = firstValidDate(pts);
  const end = lastValidDate(pts);
  const elapsedSec = start && end ? Math.max(0, (end - start) / 1000) : 0;
  const pace = dist > 0 && elapsedSec > 0 ? elapsedSec / (dist / 1000) : null;

  return { dist, gain, elapsedSec, pace };
}

function firstValidDate(pts) {
  for (const p of pts) {
    if (!p.time) continue;
    const d = new Date(p.time);
    if (!isNaN(d.getTime())) return d;
  }
  return null;
}

function lastValidDate(pts) {
  for (let i = pts.length - 1; i >= 0; i--) {
    if (!pts[i].time) continue;
    const d = new Date(pts[i].time);
    if (!isNaN(d.getTime())) return d;
  }
  return null;
}

function fmtDist(m) {
  return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';
}

function fmtPace(secPerKm) {
  if (!secPerKm || !isFinite(secPerKm)) return '—';
  const total = Math.round(secPerKm);
  const min = Math.floor(total / 60);
  const sec = String(total % 60).padStart(2, '0');
  return `${min}:${sec}/km`;
}

// ============================================================
//  Canvas
// ============================================================
const trackCanvas = document.getElementById('trackCanvas');
const elevationCanvas = document.getElementById('elevationCanvas');
const COLORS = ['#e8ff60', '#ff6b6b', '#60d4ff', '#ff9f43', '#a29bfe', '#55efc4'];

let tracks = [];
let colorIdx = 0;

function prepareCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, width: rect.width, height: rect.height };
}

function drawAll() {
  drawTrack(tracks);
  drawElevation(tracks);
}


function boundsOfTracks(trackList) {
  let minLat = Infinity, maxLat = -Infinity;
  let minLon = Infinity, maxLon = -Infinity;
  let minEle = Infinity, maxEle = -Infinity;
  let count = 0;

  for (const t of trackList) {
    for (const p of t.points) {
      if (Number.isFinite(p.lat) && Number.isFinite(p.lon)) {
        if (p.lat < minLat) minLat = p.lat;
        if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon;
        if (p.lon > maxLon) maxLon = p.lon;
        count++;
      }
      if (Number.isFinite(p.ele)) {
        if (p.ele < minEle) minEle = p.ele;
        if (p.ele > maxEle) maxEle = p.ele;
      }
    }
  }

  return { minLat, maxLat, minLon, maxLon, minEle, maxEle, count };
}

function simplifyPoints(points, maxPoints) {
  if (!points || points.length <= maxPoints) return points;
  const step = Math.ceil(points.length / maxPoints);
  const out = [];
  for (let i = 0; i < points.length; i += step) out.push(points[i]);
  const last = points[points.length - 1];
  if (out[out.length - 1] !== last) out.push(last);
  return out;
}

function drawTrack(trackList) {
  const { ctx, width, height } = prepareCanvas(trackCanvas);
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, width, height);

  if (!trackList.length) {
    ctx.fillStyle = '#7d8590';
    ctx.font = '14px -apple-system, Helvetica Neue, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GPXを選択すると軌跡を表示します', width / 2, height / 2);
    return;
  }

  const b = boundsOfTracks(trackList);
  if (!b.count || !Number.isFinite(b.minLat) || !Number.isFinite(b.minLon)) {
    showToast('緯度経度データが正しく読み取れませんでした');
    return;
  }

  const centerLat = ((b.minLat + b.maxLat) / 2) * Math.PI / 180;

  let minX = Infinity, maxX = -Infinity;
  let minY = Infinity, maxY = -Infinity;

  for (const t of trackList) {
    for (const p of t.points) {
      const x = p.lon * Math.cos(centerLat);
      const y = p.lat;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }

  const pad = 32;
  const rangeX = maxX - minX || 0.000001;
  const rangeY = maxY - minY || 0.000001;
  const scale = Math.min((width - pad * 2) / rangeX, (height - pad * 2) / rangeY);
  const usedW = rangeX * scale;
  const usedH = rangeY * scale;
  const offsetX = (width - usedW) / 2;
  const offsetY = (height - usedH) / 2;

  function px(p) {
    return offsetX + ((p.lon * Math.cos(centerLat)) - minX) * scale;
  }

  function py(p) {
    return offsetY + (maxY - p.lat) * scale;
  }

  ctx.strokeStyle = 'rgba(125,133,144,0.12)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    const gx = width * i / 5;
    const gy = height * i / 5;
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(width, gy); ctx.stroke();
  }

  trackList.forEach(t => {
    const pts = simplifyPoints(t.points, 5000);

    ctx.beginPath();
    pts.forEach((p, i) => {
      if (i === 0) ctx.moveTo(px(p), py(p));
      else ctx.lineTo(px(p), py(p));
    });

    ctx.strokeStyle = t.color;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    drawMarker(ctx, px(t.points[0]), py(t.points[0]), '#60d4ff', 'S');
    drawMarker(ctx, px(t.points[t.points.length - 1]), py(t.points[t.points.length - 1]), '#ff6b6b', 'G');
  });
}

function drawMarker(ctx, x, y, color, label) {
  ctx.beginPath();
  ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#1a1a2e';
  ctx.font = 'bold 10px -apple-system, Helvetica Neue, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + 0.5);
}

function drawElevation(trackList) {
  const { ctx, width, height } = prepareCanvas(elevationCanvas);
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = '#7d8590';
  ctx.font = '10px -apple-system, Helvetica Neue, Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('ELEVATION PROFILE', 12, 8);

  if (!trackList.length) {
    ctx.font = '13px -apple-system, Helvetica Neue, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GPXを読み込むと高低図を表示します', width / 2, height / 2);
    return;
  }

  const padL = 48, padR = 16, padT = 28, padB = 26;
  const plotW = Math.max(1, width - padL - padR);
  const plotH = Math.max(1, height - padT - padB);

  let minEle = Infinity;
  let maxEle = -Infinity;
  let eleCount = 0;
  let totalDist = 0;

  for (const t of trackList) {
    totalDist += t.dist || 0;
    for (const p of t.points) {
      if (Number.isFinite(p.ele)) {
        if (p.ele < minEle) minEle = p.ele;
        if (p.ele > maxEle) maxEle = p.ele;
        eleCount++;
      }
    }
  }

  if (eleCount < 2 || totalDist <= 0) return;

  if (maxEle - minEle < 1) {
    maxEle += 0.5;
    minEle -= 0.5;
  }

  const eleRange = maxEle - minEle;

  ctx.strokeStyle = 'rgba(125,133,144,0.25)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + plotH * i / 4;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(width - padR, y);
    ctx.stroke();
  }

  ctx.fillStyle = '#7d8590';
  ctx.font = '10px -apple-system, Helvetica Neue, Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.round(maxEle) + 'm', padL - 6, padT);
  ctx.fillText(Math.round(minEle) + 'm', padL - 6, padT + plotH);

  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText('0km', padL, height - padB + 8);
  ctx.textAlign = 'right';
  ctx.fillText((totalDist / 1000).toFixed(1) + 'km', width - padR, height - padB + 8);

  let distOffset = 0;

  trackList.forEach(t => {
    const pts = simplifyPoints(t.points, 5000);

    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = padL + ((distOffset + p.dist) / totalDist) * plotW;
      const y = padT + ((maxEle - p.ele) / eleRange) * plotH;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });

    ctx.strokeStyle = t.color;
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    distOffset += t.dist;
  });
}

// ============================================================
//  Load
// ============================================================
function loadFile(file) {
  if (!file.name.toLowerCase().endsWith('.gpx')) {
    showToast(`${file.name} はGPXファイルではありません`);
    return;
  }

  setStatus(`${file.name} を読み込み中...`);

  const reader = new FileReader();

  reader.onload = e => {
    try {
      const { name, points: rawPoints } = parseGPX(e.target.result);

      if (rawPoints.length < 2) {
        showToast(`${file.name}: トラックポイントが見つかりませんでした`);
        setStatus('読み込み失敗');
        return;
      }

      const points = enrichPoints(rawPoints);
      const color = COLORS[colorIdx++ % COLORS.length];
      const { dist, gain, pace } = calcStats(points);

      let startTime = '—';
      if (points[0].time) {
        try {
          startTime = new Date(points[0].time)
            .toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
        } catch(_) {
          startTime = points[0].time.slice(0,16);
        }
      }

      const track = {
        name, dist, gain, pace, points, color, startTime
      };

      tracks.push(track);
      updateUI(track);
      try {
        drawAll();
        setStatus(`${file.name} を表示しました。${points.length.toLocaleString()}点`);
      } catch (drawErr) {
        console.error(drawErr);
        showToast(`描画エラー: ${drawErr.message}`);
        setStatus(`読み込み成功、描画エラー: ${drawErr.message}`);
      }

    } catch(err) {
      showToast(`読み込みエラー: ${err.message}`);
      setStatus(`読み込みエラー: ${err.message}`);
    }
  };

  reader.onerror = () => {
    showToast(`${file.name}: 読み込みに失敗しました`);
    setStatus('読み込み失敗');
  };

  reader.readAsText(file, 'UTF-8');
}

function updateUI(last) {
  const has = tracks.length > 0;
  document.getElementById('statsWrap').style.display = has ? 'flex' : 'none';
  document.getElementById('clearBtn').style.display = has ? '' : 'none';

  if (!has) {
    document.getElementById('infoPanel').classList.remove('show');
    return;
  }

  const totalDist = tracks.reduce((s, t) => s + t.dist, 0);
  const totalGain = tracks.reduce((s, t) => s + t.gain, 0);
  const totalElapsed = tracks.reduce((s, t) => s + (t.pace ? t.pace * (t.dist / 1000) : 0), 0);
  const totalPace = totalDist > 0 && totalElapsed > 0 ? totalElapsed / (totalDist / 1000) : null;

  document.getElementById('sDist').textContent = fmtDist(totalDist);
  document.getElementById('sPace').textContent = fmtPace(totalPace);
  document.getElementById('sEle').textContent = Math.round(totalGain) + ' m';

  if (last) {
    document.getElementById('iName').textContent = last.name;
    document.getElementById('iDist').textContent = fmtDist(last.dist);
    document.getElementById('iPace').textContent = fmtPace(last.pace);
    document.getElementById('iEle').textContent = Math.round(last.gain) + ' m';
    document.getElementById('iTime').textContent = last.startTime;
    document.getElementById('infoPanel').classList.add('show');
  }
}

// ============================================================
//  Events
// ============================================================
document.getElementById('fileInput').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  if (!files.length) {
    setStatus('ファイルが選択されませんでした。');
    return;
  }
  setStatus(`${files.length}個のファイルを選択しました。`);
  files.forEach(loadFile);
  e.target.value = '';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  tracks = [];
  colorIdx = 0;
  updateUI(null);
  drawAll();
  setStatus('クリアしました。');
});

document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  Array.from(e.dataTransfer.files)
    .filter(f => f.name.toLowerCase().endsWith('.gpx'))
    .forEach(loadFile);
});

window.addEventListener('resize', () => {
  setTimeout(drawAll, 100);
});

drawAll();
</script>
</body>
</html>
