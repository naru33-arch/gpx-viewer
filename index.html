<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GPX / TCX Replay Viewer</title>
<!-- build: gpx-distance-only / tcx-time-replay -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:-webkit-fill-available}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#1a1a2e;color:#e6edf3;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
header{position:relative;display:flex;align-items:center;gap:8px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top));background:#16213e;border-bottom:1px solid #0f3460;flex-shrink:0;flex-wrap:wrap}
.logo{font-size:13px;font-weight:700;color:#0078ff;letter-spacing:.06em;white-space:nowrap;margin-right:4px}
#fileInput{display:block;width:calc(100% - 86px);max-width:260px;padding:8px;border:1px solid #1a5276;border-radius:6px;background:#0f3460;color:#e6edf3;font-size:13px;font-family:inherit}
.stats{display:flex;gap:14px;width:100%;align-items:flex-end;justify-content:flex-start}.stat{text-align:right}.file-stat{max-width:210px}.file-stat .stat-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stat-label{font-size:9px;color:#7d8590;text-transform:uppercase;letter-spacing:.08em}.stat-value{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}.stat-value.hi{color:#0078ff}
.clear-btn:hover{background:#1a5276;color:white}
.clear-btn{
  position:absolute;
  top:10px;
  right:12px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid #1a5276;
  background:#0f3460;
  color:#7d8590;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  min-width:36px;
}
.viewer{flex:1;min-height:0;display:grid;grid-template-rows:72% 28%;overflow:hidden}.map-wrap{position:relative;min-height:0;background:#1a1a2e;border-bottom:1px solid #0f3460}#map{width:100%;height:100%}.elevation-wrap{position:relative;min-height:0;background:#111827}#elevationCanvas{width:100%;height:100%;display:block}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(255,107,107,.95);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;display:none;max-width:90vw;text-align:center}.leaflet-container{background:#1a1a2e!important}.leaflet-control-zoom a{background:#16213e!important;color:#e6edf3!important;border-color:#0f3460!important;width:30px!important;height:30px!important;line-height:30px!important}.leaflet-control-attribution{background:rgba(22,33,62,.82)!important;color:#7d8590!important;font-size:9px!important}.leaflet-control-attribution a{color:#7d8590!important}
.controls{flex-shrink:0;background:#111827;border-top:1px solid #0f3460;padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;visibility:hidden;opacity:0;pointer-events:none}.controls.show{visibility:visible;opacity:1;pointer-events:auto}.play-btn{width:38px;height:34px;border-radius:999px;border:1px solid #1a5276;background:#0f3460;color:#e6edf3;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-appearance:none;appearance:none}.play-btn.playing{background:#0078ff;color:#fff;border-color:#0078ff}#posSlider{flex:1 1 180px;min-width:140px;accent-color:#0078ff}.pos-info{min-width:96px;text-align:right;font-size:12px;color:#e6edf3;font-variant-numeric:tabular-nums;line-height:1.25}.pos-info span{color:#0078ff;font-weight:700}.selects{display:flex;gap:6px;width:100%;align-items:center}.selects select{background:#0f3460;color:#e6edf3;border:1px solid #1a5276;border-radius:6px;padding:6px 8px;font-size:12px}.legend{margin-left:auto;font-size:10px;color:#7d8590;white-space:nowrap}

.tile-control{
  position:absolute;
  top:10px;
  right:10px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:4px;
  background:rgba(22,33,62,.88);
  border:1px solid #0f3460;
  border-radius:8px;
  padding:6px;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
}
.tile-control button{
  min-width:74px;
  padding:5px 7px;
  border-radius:6px;
  border:1px solid #1a5276;
  background:#0f3460;
  color:#7d8590;
  font-size:10px;
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
.tile-control button.active{
  color:#fff;
  background:#0078ff;
  border-color:#0078ff;
}

</style>
</head>
<body>
<header><div class="logo">GPX//VIEWER</div><input type="file" id="fileInput" accept=".gpx,.tcx,*/*"><div class="stats" id="statsWrap" style="display:none"><div class="stat file-stat"><div class="stat-label">ファイル名</div><div class="stat-value" id="sName">—</div></div><div class="stat"><div class="stat-label">距離</div><div class="stat-value hi" id="sDist">—</div></div><div class="stat"><div class="stat-label">獲得標高</div><div class="stat-value" id="sEle">—</div></div></div><button class="clear-btn" id="clearBtn" style="display:none">✕</button></header>
<div class="viewer"><div class="map-wrap">
    <div id="map"></div>
    <div class="tile-control" id="tileControl">
      <button type="button" data-tile="gsi_std" class="active">地理院 標準</button>
      <button type="button" data-tile="gsi_pale">地理院 淡色</button>
      <button type="button" data-tile="gsi_photo">地理院 写真</button>
      <button type="button" data-tile="osm">OSM</button>
      <button type="button" data-tile="opentopo">Topo</button>
    </div>
  </div><div class="elevation-wrap"><canvas id="elevationCanvas"></canvas></div></div>
<div class="controls" id="controls"><button class="play-btn" id="playBtn" type="button">▶</button><input type="range" id="posSlider" min="0" max="1000" value="0"><div class="pos-info"><span id="posDist">0.0km</span><br><span id="posEle">0m</span></div><div class="selects"><select id="speedSelect">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
    </select><select id="colorMode"><option value="single">単色</option><option value="run">ラン（ペース）</option><option value="trail" selected>トレラン（速度）</option><option value="hr">心拍</option></select><div class="legend" id="legend">1x=30秒再生</div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
const fileInput=document.getElementById('fileInput'),elevationCanvas=document.getElementById('elevationCanvas'),statsWrap=document.getElementById('statsWrap'),clearBtn=document.getElementById('clearBtn'),controls=document.getElementById('controls'),playBtn=document.getElementById('playBtn'),posSlider=document.getElementById('posSlider'),posDist=document.getElementById('posDist'),posEle=document.getElementById('posEle'),speedSelect=document.getElementById('speedSelect'),colorMode=document.getElementById('colorMode'),legend=document.getElementById('legend');
let tracks=[],mapLayers=[],currentMarker=null,currentDistance=0,playTimer=null,isPlaying=false,playStartReal=0,playStartActivity=0,allBounds=null;
const DEFAULT_COLOR='#0078ff';
const map=L.map('map',{center:[36.2,138.2],zoom:5,zoomControl:true,attributionControl:true});
const TILE_DEFS={
  gsi_std:{
    url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
    options:{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18}
  },
  gsi_pale:{
    url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
    options:{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18}
  },
  gsi_photo:{
    url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
    options:{attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',maxZoom:18}
  },
  osm:{
    url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    options:{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}
  },
  opentopo:{
    url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    options:{attribution:'&copy; OpenStreetMap contributors, SRTM | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>',maxZoom:17}
  }
};
let currentTileLayer=null;
function setBaseTile(key){
  const def=TILE_DEFS[key]||TILE_DEFS.gsi_std;
  if(currentTileLayer)map.removeLayer(currentTileLayer);
  currentTileLayer=L.tileLayer(def.url,def.options).addTo(map);
  document.querySelectorAll('#tileControl button').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.tile===key);
  });
}
setBaseTile('gsi_std');
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none'},4000)}
function fmtDist(m){return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}
function haversine(a,b){const R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r,s=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))}
function enrichPoints(pts){let dist=0;return pts.map((p,i)=>{if(i>0)dist+=haversine(pts[i-1],p);return {...p,dist:Number.isFinite(p.distance)?p.distance:dist}})}

function normalizeDistances(pts){
  if(!pts||!pts.length)return [];
  const hasDistance=pts.some(p=>Number.isFinite(p.distance)&&p.distance>0);
  if(hasDistance){
    let last=0;
    return pts.map((p,i)=>{
      let d=Number.isFinite(p.distance)?p.distance:last;
      if(i>0&&d<last)d=last;
      last=d;
      return {...p,dist:d};
    });
  }
  let dist=0;
  return pts.map((p,i)=>{
    if(i>0)dist+=haversine(pts[i-1],p);
    return {...p,dist};
  });
}
function calcStats(pts){let dist=pts.length?pts[pts.length-1].dist:0,gain=0;for(let i=1;i<pts.length;i++){const d=pts[i].ele-pts[i-1].ele;if(d>0)gain+=d}return{dist,gain}}
function simplifyPoints(points,maxPoints){if(!points||points.length<=maxPoints)return points;const step=Math.ceil(points.length/maxPoints),out=[];for(let i=0;i<points.length;i+=step)out.push(points[i]);const last=points[points.length-1];if(out[out.length-1]!==last)out.push(last);return out}
function prepareCanvas(canvas){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,width:rect.width,height:rect.height}}
function parseGPX(text){
  const clean=text.replace(/^\uFEFF/,'');
  const xml=clean
    .replace(/\s+xmlns[^=]*="[^"]*"/g,'')
    .replace(/<([a-zA-Z]+:[a-zA-Z])/g,m=>'<'+m.slice(m.indexOf(':')+1))
    .replace(/<\/([a-zA-Z]+:[a-zA-Z])/g,m=>'</'+m.slice(m.indexOf(':')+1));

  let points=[],name='トラック';

  try{
    const doc=new DOMParser().parseFromString(xml,'application/xml');

    if(!doc.querySelector('parsererror')){
      name=doc.querySelector('trk > name, rte > name, name')?.textContent?.trim()||name;

      doc.querySelectorAll('trkpt, rtept').forEach(p=>{
        const lat=parseFloat(p.getAttribute('lat'));
        const lon=parseFloat(p.getAttribute('lon'));

        if(!isNaN(lat)&&!isNaN(lon)){
          const eleText=p.querySelector('ele')?.textContent;
          const timeText=p.querySelector('time')?.textContent?.trim();

          points.push({
            lat,
            lon,
            ele:Number.isFinite(parseFloat(eleText))?parseFloat(eleText):0,
            time:null,
            hr:null,
            distance:null
          });
        }
      });
    }
  }catch(_){}

  if(points.length===0){
    const nm=clean.match(/<name[^>]*>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/name>/i);
    if(nm)name=nm[1].trim();

    for(const m of clean.matchAll(/<(?:[\w:]*(?:trkpt|rtept))([^>]+)>([\s\S]*?)<\/(?:[\w:]*(?:trkpt|rtept))>/gi)){
      const attrs=m[1];
      const inner=m[2];

      const latM=attrs.match(/lat=["']([^"']+)["']/i);
      const lonM=attrs.match(/lon=["']([^"']+)["']/i);

      if(!latM||!lonM)continue;

      const lat=parseFloat(latM[1]);
      const lon=parseFloat(lonM[1]);

      if(isNaN(lat)||isNaN(lon))continue;

      const eleM=inner.match(/<(?:[\w:]*ele)[^>]*>([\s\S]*?)<\/(?:[\w:]*ele)>/i);
      const timeM=inner.match(/<(?:[\w:]*time)[^>]*>([\s\S]*?)<\/(?:[\w:]*time)>/i);

      points.push({
        lat,
        lon,
        ele:eleM?parseFloat(eleM[1])||0:0,
        time:null,
        hr:null,
        distance:null
      });
    }
  }

  return{name,points:normalizeDistances(points),type:'gpx'};
}

function parseTCX(text){const doc=new DOMParser().parseFromString(text.replace(/^\uFEFF/,''),'application/xml');if(doc.querySelector('parsererror'))throw new Error('TCX/XMLとして解析できません');let name=doc.querySelector('Activity Id')?.textContent?.trim()||doc.querySelector('Name')?.textContent?.trim()||'TCXアクティビティ';let points=[];doc.querySelectorAll('Trackpoint').forEach(tp=>{const lat=parseFloat(tp.querySelector('Position LatitudeDegrees')?.textContent),lon=parseFloat(tp.querySelector('Position LongitudeDegrees')?.textContent);if(isNaN(lat)||isNaN(lon))return;const ele=parseFloat(tp.querySelector('AltitudeMeters')?.textContent),distance=parseFloat(tp.querySelector('DistanceMeters')?.textContent),timeText=tp.querySelector('Time')?.textContent?.trim(),hr=parseFloat(tp.querySelector('HeartRateBpm Value')?.textContent);points.push({lat,lon,ele:Number.isFinite(ele)?ele:0,distance:Number.isFinite(distance)?distance:null,time:timeText?new Date(timeText).getTime():null,hr:Number.isFinite(hr)?hr:null})});return{name,points:enrichPoints(points),type:'tcx'}}
function enrichSpeed(pts){
  // GPS揺れで色が細かく変わりすぎないよう、約15秒または最大15ポイントで平滑化。
  for(let i=0;i<pts.length;i++){
    let j=i;
    while(j>0){
      const dt=(pts[i].time||0)-(pts[j-1].time||0);
      if(dt>=15000 || i-(j-1)>=15)break;
      j--;
    }

    if(j===i && i>0)j=i-1;

    const a=pts[j],b=pts[i];

    if(a&&b&&Number.isFinite(a.time)&&Number.isFinite(b.time)&&b.time>a.time){
      const dt=(b.time-a.time)/1000;
      const dd=Math.max(0,b.dist-a.dist);
      b.speedKmh=(dd/dt)*3.6;
    }else{
      b.speedKmh=null;
    }
  }
  return pts;
}
function makeMarker(color,label){return L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50%;background:${color};border:2px solid #1a1a2e;color:#1a1a2e;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px ${color}66;">${label}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}
function makeCurrentIcon(color='#ff2d55'){return L.divIcon({className:'',html:`<div style="width:22px;height:22px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 0 0 2px ${color}66,0 2px 8px rgba(0,0,0,.35);"></div>`,iconSize:[22,22],iconAnchor:[11,11]})}
function getTotalDistance(){return tracks.reduce((s,t)=>s+(t.dist||0),0)}
function getColorByPoint(p){
  const trackType=tracks[0]?.type||'gpx';
  if(trackType==='gpx')return DEFAULT_COLOR;

  const mode=colorMode.value;
  if(mode==='single')return DEFAULT_COLOR;

  if(mode==='hr'){
    const hr=p.hr;
    if(!Number.isFinite(hr))return DEFAULT_COLOR;
    if(hr<120)return '#2f80ed';
    if(hr<140)return '#27ae60';
    if(hr<155)return '#f2c94c';
    return '#eb5757';
  }

  const speed=p.speedKmh;

  if(mode==='trail'){
    if(!Number.isFinite(speed))return DEFAULT_COLOR;
    if(speed>=8)return '#2f80ed';
    if(speed>=5)return '#27ae60';
    if(speed>=2)return '#f2c94c';
    return '#eb5757';
  }

  if(mode==='run'){
    if(!Number.isFinite(speed)||speed<=0)return '#eb5757';
    const pace=60/speed;
    if(pace<=5.0)return '#2f80ed';
    if(pace<=6.0)return '#27ae60';
    if(pace<=7.0)return '#f2c94c';
    return '#eb5757';
  }

  return DEFAULT_COLOR;
}
function getPointAtDistance(targetDist){if(!tracks.length)return null;let offset=0;for(const t of tracks){const pts=t.points;if(targetDist<=offset+(t.dist||0)){const local=targetDist-offset;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(local<=b.dist){const seg=b.dist-a.dist||1,r=Math.max(0,Math.min(1,(local-a.dist)/seg));return{lat:a.lat+(b.lat-a.lat)*r,lon:a.lon+(b.lon-a.lon)*r,ele:a.ele+(b.ele-a.ele)*r,dist:targetDist,hr:b.hr,speedKmh:b.speedKmh,time:b.time}}}return{...pts[pts.length-1],dist:targetDist}}offset+=t.dist||0}const lt=tracks[tracks.length-1],last=lt.points[lt.points.length-1];return{...last,dist:getTotalDistance()}}
function getPointAtElapsed(elapsedSec){const t=tracks[0];if(!t||t.type!=='tcx'||!t.hasTime)return getPointAtDistance(getTotalDistance()*(Number(posSlider.value)/1000));const target=t.startTime+elapsedSec*1000,pts=t.points;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(Number.isFinite(a.time)&&Number.isFinite(b.time)&&target<=b.time){const dt=b.time-a.time||1,r=Math.max(0,Math.min(1,(target-a.time)/dt));return{lat:a.lat+(b.lat-a.lat)*r,lon:a.lon+(b.lon-a.lon)*r,ele:a.ele+(b.ele-a.ele)*r,dist:a.dist+(b.dist-a.dist)*r,hr:b.hr,speedKmh:b.speedKmh,time:target}}}return{...pts[pts.length-1]}}
function drawColoredTrack(track){
  const pts=simplifyPoints(track.points,7000);
  if(!pts||pts.length<2)return;

  // まず滑らかなベース線を1本描く。これでドット感・途切れ感を抑える。
  const baseLatLngs=pts.map(p=>[p.lat,p.lon]);
  const baseColor=(track.type==='gpx'||colorMode.value==='single')?DEFAULT_COLOR:'rgba(0,120,255,.28)';
  const base=L.polyline(baseLatLngs,{
    color:baseColor,
    weight:5,
    opacity:.95,
    lineJoin:'round',
    lineCap:'round'
  }).addTo(map);
  mapLayers.push(base);
  const baseBounds=base.getBounds();
  allBounds=allBounds?allBounds.extend(baseBounds):baseBounds;

  // GPXまたは単色モードならベース線だけ。
  if(track.type==='gpx'||colorMode.value==='single')return;

  // 色分けは細かすぎるとドット状に見えるため、約200m単位でまとめて描く。
  const chunkMeters=200;
  let startIdx=0;
  let lastChunkDist=pts[0].dist||0;

  function drawChunk(a,b,color){
    if(b<=a)return;
    const seg=pts.slice(a,b+1).map(p=>[p.lat,p.lon]);
    if(seg.length<2)return;
    const poly=L.polyline(seg,{
      color,
      weight:5,
      opacity:.92,
      lineJoin:'round',
      lineCap:'round'
    }).addTo(map);
    mapLayers.push(poly);
  }

  for(let i=1;i<pts.length;i++){
    const d=pts[i].dist||0;
    if(d-lastChunkDist>=chunkMeters || i===pts.length-1){
      const mid=pts[Math.floor((startIdx+i)/2)]||pts[i];
      const color=getColorByPoint(mid);
      drawChunk(startIdx,i,color);
      startIdx=i;
      lastChunkDist=d;
    }
  }
}
function addTrackToMap(track){drawColoredTrack(track);const start=track.points[0],goal=track.points[track.points.length-1];const startM=L.marker([start.lat,start.lon],{icon:makeMarker('#0078ff','S')}).addTo(map),goalM=L.marker([goal.lat,goal.lon],{icon:makeMarker('#ff6b6b','G')}).addTo(map);mapLayers.push(startM,goalM);if(allBounds&&allBounds.isValid())map.fitBounds(allBounds,{padding:[32,32]})}
function redrawMapTracks(){const keep=currentMarker;mapLayers.forEach(layer=>{if(layer!==keep)map.removeLayer(layer)});mapLayers=keep?[keep]:[];allBounds=null;tracks.forEach(addTrackToMap)}
function drawElevation(trackList,markerDist=null){const {ctx,width,height}=prepareCanvas(elevationCanvas);ctx.clearRect(0,0,width,height);ctx.fillStyle='#111827';ctx.fillRect(0,0,width,height);ctx.fillStyle='#7d8590';ctx.font='10px -apple-system, Helvetica Neue, Arial, sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('ELEVATION PROFILE',12,8);if(!trackList.length){ctx.font='13px -apple-system, Helvetica Neue, Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GPX / TCXを読み込むと高低図を表示します',width/2,height/2);return}const padL=48,padR=16,padT=28,padB=48,plotW=Math.max(1,width-padL-padR),plotH=Math.max(1,height-padT-padB);let minEle=Infinity,maxEle=-Infinity,eleCount=0,totalDist=0;for(const t of trackList){totalDist+=t.dist||0;for(const p of t.points){if(Number.isFinite(p.ele)){if(p.ele<minEle)minEle=p.ele;if(p.ele>maxEle)maxEle=p.ele;eleCount++}}}if(eleCount<2||totalDist<=0)return;if(maxEle-minEle<1){maxEle+=.5;minEle-=.5}const eleRange=maxEle-minEle,minGrid=Math.floor(minEle/100)*100,maxGrid=Math.ceil(maxEle/100)*100;const labelMinGap=18;let lastEleLabelY=-9999;for(let ele=minGrid;ele<=maxGrid;ele+=100){const y=padT+((maxEle-ele)/eleRange)*plotH;ctx.strokeStyle=(ele%200===0)?'rgba(125,133,144,.35)':'rgba(125,133,144,.18)';ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(width-padR,y);ctx.stroke();ctx.fillStyle='#7d8590';if(Math.abs(y-lastEleLabelY)>=labelMinGap||ele===minGrid||ele===maxGrid){ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(ele+'m',padL-6,y);lastEleLabelY=y}}const totalKm=totalDist/1000,kmStep=totalKm<=50?5:(totalKm<=100?10:20);for(let km=0;km<=totalKm;km+=kmStep){const x=padL+((km*1000)/totalDist)*plotW;ctx.strokeStyle=(km%(kmStep*2)===0)?'rgba(125,133,144,.35)':'rgba(125,133,144,.18)';ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,padT+plotH);ctx.stroke();ctx.save();ctx.translate(x,height-padB+36);ctx.rotate(-Math.PI/2);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#7d8590';ctx.fillText(km+'km',0,0);ctx.restore()}let distOffset=0;for(const t of trackList){const pts=simplifyPoints(t.points,5000);ctx.beginPath();pts.forEach((p,i)=>{const x=padL+((distOffset+p.dist)/totalDist)*plotW,y=padT+((maxEle-p.ele)/eleRange)*plotH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle=DEFAULT_COLOR;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();distOffset+=t.dist}if(markerDist!==null&&totalDist>0){const mx=padL+(markerDist/totalDist)*plotW;ctx.strokeStyle='#ff2d55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx,padT);ctx.lineTo(mx,padT+plotH);ctx.stroke();const p=getPointAtDistance(markerDist);if(p){const my=padT+((maxEle-p.ele)/eleRange)*plotH;ctx.beginPath();ctx.arc(mx,my,4,0,Math.PI*2);ctx.fillStyle='#ff2d55';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}}}
function updateUI(last){const has=tracks.length>0;statsWrap.style.display=has?'flex':'none';clearBtn.style.display=has?'':'none';if(!has)return;const totalDist=tracks.reduce((s,t)=>s+t.dist,0),totalGain=tracks.reduce((s,t)=>s+t.gain,0);document.getElementById('sName').textContent=last?last.name:tracks[tracks.length-1].name;document.getElementById('sDist').textContent=fmtDist(totalDist);document.getElementById('sEle').textContent=Math.round(totalGain)+' m'}
function updateLegend(){
  const trackType=tracks[0]?.type||'gpx';
  if(trackType==='gpx'){
    legend.textContent='GPXは青単色 / 1x=30秒';
    return;
  }
  const m=colorMode.value;
  if(m==='hr')legend.textContent='心拍: 青<120 緑<140 黄<155 赤 / 1x=30秒';
  else if(m==='run')legend.textContent='ペース: 青≤5:00 緑≤6:00 黄≤7:00 赤 / 1x=30秒';
  else if(m==='trail')legend.textContent='速度: 青8+ 緑5+ 黄2+ 赤 / 1x=30秒';
  else legend.textContent='単色表示 / 1x=30秒';
}
function updateCurrentPosition(p){if(!p)return;const c=getColorByPoint(p);if(!currentMarker){currentMarker=L.marker([p.lat,p.lon],{icon:makeCurrentIcon('#ff2d55'),zIndexOffset:1000}).addTo(map);mapLayers.push(currentMarker)}else{currentMarker.setIcon(makeCurrentIcon('#ff2d55'));currentMarker.setLatLng([p.lat,p.lon])}const currentPoint=map.latLngToContainerPoint([p.lat,p.lon]),mapSize=map.getSize(),targetPoint=L.point(mapSize.x*.5,mapSize.y*.5),panOffset=currentPoint.subtract(targetPoint);map.panBy(panOffset,{animate:false});currentDistance=p.dist||0;posDist.textContent=(currentDistance/1000).toFixed(1)+'km';posEle.textContent=Math.round(p.ele)+'m';drawElevation(tracks,currentDistance)}
function updateCurrentPositionByProgress(progress){
  const t=tracks[0];
  if(!t)return;

  progress=Math.max(0,Math.min(1,progress));

  // TCXだけ実時間ベース。GPXはTimeが入っていても必ず距離ベース。
  if(t.type==='tcx'&&t.hasTime){
    const elapsed=t.elapsed*progress;
    updateCurrentPosition(getPointAtElapsed(elapsed));
  }else{
    const total=getTotalDistance();
    updateCurrentPosition(getPointAtDistance(total*progress));
  }
}

function updateCurrentPositionFromSlider(){
  updateCurrentPositionByProgress(Number(posSlider.value)/1000);
}
function setPlaying(on){isPlaying=on;playBtn.textContent=on?'⏸':'▶';playBtn.classList.toggle('playing',on)}function stopPlayback(){if(playTimer){clearInterval(playTimer);playTimer=null}setPlaying(false)}
function startPlayback(){
  if(!tracks.length)return;
  stopPlayback();
  setPlaying(true);

  // 1x = 全コース30秒で再生。
  // 0.5x = 60秒、2x = 15秒、4x = 7.5秒。
  // TCXは実際のTime比率を保ったまま30秒へ圧縮。
  // GPXは距離比率で30秒再生。
  const speed=Number(speedSelect.value)||1;
  const replayDurationMs=30000/speed;

  const startSlider=Number(posSlider.value)||0;
  const startProgress=startSlider/1000;
  const startReal=Date.now();

  playTimer=setInterval(()=>{
    const elapsedReal=Date.now()-startReal;
    let progress=startProgress+(elapsedReal/replayDurationMs)*(1-startProgress);

    if(progress>=1){
      progress=1;
      posSlider.value=1000;
      updateCurrentPositionByProgress(progress);
      stopPlayback();
      return;
    }

    posSlider.value=Math.round(progress*1000);
    updateCurrentPositionByProgress(progress);
  },50);
}
function togglePlayback(){if(isPlaying)stopPlayback();else startPlayback()}
function loadFile(file){stopPlayback();const lower=file.name.toLowerCase();if(!lower.endsWith('.gpx')&&!lower.endsWith('.tcx')){showToast(`${file.name} はGPX/TCXファイルではありません`);return}const reader=new FileReader();reader.onload=e=>{try{const parsed=lower.endsWith('.tcx')?parseTCX(e.target.result):parseGPX(e.target.result);let points=enrichSpeed(parsed.points);if(points.length<2){showToast(`${file.name}: トラックポイントが見つかりませんでした`);return}const {dist,gain}=calcStats(points),times=points.map(p=>p.time).filter(v=>Number.isFinite(v)),hasTime=(parsed.type==='tcx'&&times.length>=2),startTime=hasTime?times[0]:null,endTime=hasTime?times[times.length-1]:null,elapsed=hasTime?(endTime-startTime)/1000:0,track={name:parsed.name,points,dist,gain,type:parsed.type,hasTime,startTime,endTime,elapsed};mapLayers.forEach(layer=>map.removeLayer(layer));tracks=[];mapLayers=[];allBounds=null;currentMarker=null;currentDistance=0;tracks.push(track);addTrackToMap(track);controls.classList.add('show');posSlider.value=0;updateUI(track);updateLegend();updateCurrentPositionFromSlider()}catch(err){console.error(err);showToast(`読み込みエラー: ${err.message}`)}};reader.onerror=()=>showToast(`${file.name}: 読み込みに失敗しました`);reader.readAsText(file,'UTF-8')}
document.querySelectorAll('#tileControl button').forEach(btn=>btn.addEventListener('click',()=>setBaseTile(btn.dataset.tile)));
posSlider.addEventListener('input',()=>{stopPlayback();updateCurrentPositionFromSlider()});playBtn.addEventListener('click',togglePlayback);speedSelect.addEventListener('change',()=>{if(isPlaying)startPlayback()});colorMode.addEventListener('change',()=>{updateLegend();redrawMapTracks();updateCurrentPositionFromSlider()});fileInput.addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(file)loadFile(file);e.target.value=''});clearBtn.addEventListener('click',()=>{stopPlayback();mapLayers.forEach(layer=>map.removeLayer(layer));tracks=[];mapLayers=[];currentMarker=null;allBounds=null;controls.classList.remove('show');statsWrap.style.display='none';clearBtn.style.display='none';posSlider.value=0;posDist.textContent='0.0km';posEle.textContent='0m';drawElevation(tracks)});window.addEventListener('resize',()=>setTimeout(()=>{map.invalidateSize();drawElevation(tracks,currentDistance)},100));drawElevation(tracks);
})();
</script></body></html>
